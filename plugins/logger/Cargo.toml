[package]
name = "tessar_logger"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
