name: verify
on:
  push:
    branches: ['release']
  pull_request:
    branches: ['dev', 'main', 'release']
permissions:
  contents: read
jobs:
  server-storage:
    # MongoDB 8.0 rejects newer runner kernels (SERVER-121912).
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - postgres-image: pgvector/pgvector:pg17
            bm25: '0'
          - postgres-image: paradedb/paradedb:0.26.4-pg17
            bm25: '1'
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_USER: tessar
          POSTGRES_PASSWORD: tessar
          POSTGRES_DB: tessar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tessar -d tessar_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TESSAR_TEST_POSTGRES_URL: postgres://tessar:tessar@localhost:5432/tessar_test
      TESSAR_TEST_POSTGRES_BM25: ${{ matrix.bm25 }}
      TESSAR_TEST_MONGODB_URL: mongodb://localhost:27017/?replicaSet=rs0
      TESSAR_TEST_MONGODB_SEARCH_URL: ${{ matrix.bm25 == '1' && 'mongodb://localhost:27018/?directConnection=true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Enable pgvector in test database
        run: docker exec ${{ job.services.postgres.id }} psql -U tessar -d tessar_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Enable BM25 in BM25 test database
        if: matrix.bm25 == '1'
        run: docker exec ${{ job.services.postgres.id }} psql -U tessar -d tessar_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_search CASCADE'
      - name: Start MongoDB replica set
        run: |
          wait_for_mongo() {
            for attempt in $(seq 1 60); do
              if [ "$(docker inspect --format '{{.State.Running}}' tessar-mongo)" != true ]; then
                echo "::error::MongoDB container exited before it became ready"
                return 1
              fi
              if docker exec tessar-mongo mongosh --quiet --eval "$1"; then return 0; fi
              sleep 2
            done
            echo "::error::Timed out waiting for MongoDB: $1"
            return 1
          }
          docker run -d --name tessar-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          wait_for_mongo 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'
          docker exec tessar-mongo mongosh --quiet --eval 'quit(rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok === 1 ? 0 : 1)'
          wait_for_mongo 'quit(db.hello().isWritablePrimary ? 0 : 1)'
      - name: Start MongoDB Search test deployment
        if: matrix.bm25 == '1'
        run: |
          docker run -d --name tessar-mongo-search --hostname localhost -e DO_NOT_TRACK=1 -p 127.0.0.1:27018:27017 mongodb/mongodb-atlas-local:8.0
          for attempt in $(seq 1 90); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tessar-mongo-search)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' tessar-mongo-search)" != true ]; then
              docker logs tessar-mongo-search
              exit 1
            fi
            sleep 2
          done
          docker logs tessar-mongo-search
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:storage --maxWorkers 4
      - name: Database logs on failure
        if: failure()
        run: |
          uname -r
          docker inspect --format '{{json .State}}' tessar-mongo || true
          docker logs tessar-mongo || true
          docker logs tessar-mongo-search || true
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test --maxWorkers 4
      - run: pnpm test:integration --maxWorkers ${{ runner.os == 'Windows' && 2 || 4 }}
      - run: pnpm check:boundaries
