    CreateUserResponse:
      type: object
      required:
        - id
        - name
        - email
        - role
        - created_at
        - status
        - is_developer
        - invite_mode
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: Unique identifier for the user
        name:
          type: string
          description: Full name of the user
        email:
          allOf:
            - $ref: '#/components/schemas/Email'
