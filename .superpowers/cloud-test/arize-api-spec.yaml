          description: Custom Bedrock endpoint URL. Null when not set.
      additionalProperties: false
      x-forward-compatible: true
    AwsBedrockConfig:
      x-forward-compatible: true
      type: object
      description: Config for an AWS Bedrock LLM integration. The model catalog is caller-controlled via `is_default_models_enabled` and `model_names`. Function/tool-calling settings do not apply to Bedrock and are omitted.
      required:
        - provider
        - is_default_models_enabled
        - model_names
        - auth
      properties:
        provider:
          type: string
          enum:
            - AWS_BEDROCK
          description: Discriminator identifying the AWS Bedrock provider.
        is_default_models_enabled:
          type: boolean
          description: Whether Arize's default Bedrock model catalog is enabled.
        model_names:
          type: array
          items:
            type: string
          description: Custom model names configured on this integration. Empty when none.
        auth:
          $ref: '#/components/schemas/AwsBedrockAuth'
      additionalProperties: true
    AwsBedrockDefaultAuth:
      type: object
      description: 'Role-assumption auth for AWS Bedrock: Arize assumes the provided IAM role to call Bedrock. The role ARN and external ID are not secrets and are returned on read.'
      required:
        - auth_type
        - role_arn
        - external_id
        - base_url
      properties:
        auth_type:
          type: string
          enum:
            - DEFAULT
          description: Discriminator identifying role-assumption auth.
        role_arn:
          type: string
          description: AWS IAM role ARN Arize assumes for cross-account access.
        external_id:
          type: string
          nullable: true
          description: External ID on the assume-role policy. Null when not set.
        base_url:
          type: string
          nullable: true
          description: Custom Bedrock endpoint URL. Null when not set.
      additionalProperties: false
      x-forward-compatible: true
    AwsBedrockProxyWithHeadersAuth:
      type: object
      description: 'Proxy auth for AWS Bedrock: requests are forwarded to a proxy URL with custom headers. Header values are write-only; configured names are returned as `header_names`.'
      required:
        - auth_type
        - base_url
        - header_names
      properties:
        auth_type:
          type: string
          enum:
            - PROXY_WITH_HEADERS
          description: Discriminator identifying proxy auth.
        base_url:
          type: string
          description: Proxy URL requests are forwarded to.
        header_names:
          type: array
          items:
            type: string
          description: Names of the custom request headers configured on this integration. Empty when none are configured. Header values are write-only and never returned.
      additionalProperties: false
      x-forward-compatible: true
    CreateAgentConfig:
      type: object
      required:
        - endpoint
        - input_schema
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS endpoint requests are sent to. Validated server-side and must resolve to a public address.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Cleartext header map. Encrypted at rest; never returned in responses.
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema (Draft-07) the endpoint's request body conforms to.
        request_presets:
          type: array
          items:
            $ref: '#/components/schemas/CreateAgentRequestPresetInput'
          description: Optional initial presets for the integration.
      additionalProperties: false
    CreateAgentIntegrationRequest:
      type: object
      required:
        - type
        - name
        - config
      properties:
        type:
          type: string
          enum:
            - AGENT
          description: Discriminator identifying this request as an agent integration.
        name:
          type: string
          description: Integration name. Must be unique among active AGENT and EVALUATOR integrations in the account.
        description:
          type: string
          nullable: true
          description: Optional human-readable description of the integration.
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationScopingRequest'
          description: |
            Visibility scoping rules. Defaults to account-wide if omitted
            or empty. A scoping with `space_id` set MUST also set
            `organization_id`.
        config:
          $ref: '#/components/schemas/CreateAgentConfig'
          description: Endpoint and request-schema configuration for the agent integration.
      additionalProperties: false
    CreateAgentRequestPresetInput:
      type: object
      description: |
        Write shape for an agent request preset on create. Server-generated fields
        (`id`, `created_at`, `updated_at`) are not accepted on input.
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Preset name (unique within the integration). Length 1-255.
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Optional preset description (length 0-1024).
        config:
          type: object
          additionalProperties: true
          description: |
            Partial request body. Validated against the parent integration's
            `input_schema` with `required` dropped.
      additionalProperties: false
    CreateAnthropicConfig:
      description: Create config for an Anthropic LLM integration. `api_key` is required and is write-only (never returned in responses). `base_url` is optional; omit it to use the public Anthropic API.
      type: object
      required:
        - provider
        - api_key
      properties:
        is_function_calling_enabled:
          type: boolean
          description: Enable function/tool calling. Defaults to true.
        provider:
          type: string
          enum:
            - ANTHROPIC
          description: Discriminator identifying the Anthropic provider.
        api_key:
          type: string
          description: API key for the provider (write-only, never returned).
        base_url:
          type: string
          description: Endpoint URL (HTTPS) serving the Anthropic Messages API, including the version path (e.g. `https://api.anthropic.com/v1`). Do not include `/messages`, which is appended automatically. Defaults to the public Anthropic API.
      additionalProperties: false
    CreateAwsBedrockAuth:
      type: object
      description: AWS Bedrock auth settings for create and update, discriminated by `auth_type`. On PATCH this object replaces the stored auth settings wholesale (auth_type may change); omitted fields of the previous auth mode are cleared.
      discriminator:
        propertyName: auth_type
        mapping:
          DEFAULT: '#/components/schemas/CreateAwsBedrockDefaultAuth'
          BEARER_TOKEN: '#/components/schemas/CreateAwsBedrockBearerTokenAuth'
          PROXY_WITH_HEADERS: '#/components/schemas/CreateAwsBedrockProxyWithHeadersAuth'
      oneOf:
        - $ref: '#/components/schemas/CreateAwsBedrockDefaultAuth'
        - $ref: '#/components/schemas/CreateAwsBedrockBearerTokenAuth'
        - $ref: '#/components/schemas/CreateAwsBedrockProxyWithHeadersAuth'
    CreateAwsBedrockBearerTokenAuth:
      type: object
      description: Create bearer-token auth. `api_key` is required and write-only (never returned; surfaces as `has_api_key` on read).
      required:
        - auth_type
        - api_key
      properties:
        auth_type:
          type: string
          enum:
            - BEARER_TOKEN
          description: Discriminator identifying bearer-token auth.
        api_key:
          type: string
          description: Bearer token for Bedrock (write-only, never returned).
        base_url:
          type: string
          description: Custom Bedrock endpoint URL. Defaults to the provider default endpoint.
      additionalProperties: false
    CreateAwsBedrockConfig:
      type: object
      description: 'Create config for an AWS Bedrock LLM integration. `auth` selects one of three auth modes via `auth_type`. The integration must have at least one model available: enable `is_default_models_enabled` or provide at least one entry in `model_names`, otherwise the request is rejected with 422.'
      required:
        - provider
        - auth
      properties:
        provider:
          type: string
          enum:
            - AWS_BEDROCK
          description: Discriminator identifying the AWS Bedrock provider.
        auth:
          $ref: '#/components/schemas/CreateAwsBedrockAuth'
        is_default_models_enabled:
          type: boolean
          description: Enable Arize's default Bedrock model catalog. Defaults to false.
        model_names:
          type: array
          items:
            type: string
          description: Custom model names to make available. Defaults to none.
      additionalProperties: false
    CreateAwsBedrockDefaultAuth:
      type: object
      description: Create role-assumption auth. `role_arn` is required.
      required:
        - auth_type
        - role_arn
      properties:
        auth_type:
          type: string
          enum:
            - DEFAULT
          description: Discriminator identifying role-assumption auth.
        role_arn:
          type: string
          description: AWS IAM role ARN Arize assumes for cross-account access.
        external_id:
          type: string
          description: External ID on the assume-role policy. Defaults to not set.
        base_url:
          type: string
          description: Custom Bedrock endpoint URL. Defaults to the provider default endpoint.
      additionalProperties: false
    CreateAwsBedrockProxyWithHeadersAuth:
      type: object
      description: Create proxy auth. `base_url` is required. `headers` is write-only; names are returned as `header_names` on read.
      required:
        - auth_type
        - base_url
      properties:
        auth_type:
          type: string
          enum:
            - PROXY_WITH_HEADERS
          description: Discriminator identifying proxy auth.
        base_url:
          type: string
          description: Proxy URL requests are forwarded to (HTTPS).
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Custom request headers sent to the proxy, as a name-to-value map. Write-only: values are never returned; names are exposed as `header_names` on read. Defaults to no headers. The serialized header map must not exceed 8,175 bytes.'
      additionalProperties: false
    CreateCustomAuth:
      type: object
      description: Custom endpoint auth settings for create and update, discriminated by `auth_type`. On PATCH this object replaces the stored auth settings wholesale (auth_type may change); credentials belonging to the auth mode being switched away from are cleared.
      discriminator:
        propertyName: auth_type
        mapping:
          DEFAULT: '#/components/schemas/CreateCustomDefaultAuth'
          OAUTH2_CLIENT_CREDENTIALS: '#/components/schemas/CreateCustomOauth2ClientCredentialsAuth'
      oneOf:
        - $ref: '#/components/schemas/CreateCustomDefaultAuth'
        - $ref: '#/components/schemas/CreateCustomOauth2ClientCredentialsAuth'
    CreateCustomConfig:
      description: 'Create config for a custom OpenAI-compatible endpoint integration. `base_url` is required and must implement the OpenAI API shape (it is validated server-side and must resolve to a public address). `api_key` and `headers` are write-only (never returned; headers surface as `header_names` on read). The integration must have at least one model source: enable `is_default_models_enabled` or provide at least one entry in `model_names`, otherwise the request is rejected with 422.'
      type: object
      required:
        - provider
        - base_url
      properties:
        is_function_calling_enabled:
          type: boolean
          description: Enable function/tool calling. Defaults to true.
        provider:
          type: string
          enum:
            - CUSTOM
          description: Discriminator identifying a custom OpenAI-compatible endpoint.
        base_url:
          type: string
          description: Endpoint URL requests are sent to (HTTPS).
        api_key:
          type: string
          description: 'API key for the endpoint (write-only, never returned). Equivalent to an `auth` block with `auth_type: DEFAULT`; supplying both this and `auth` is rejected with 422.'
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Custom request headers sent to the endpoint, as a name-to-value map. Write-only: values are never returned; names are exposed as `header_names` on read. Defaults to no headers. The serialized header map must not exceed 8,175 bytes.'
        is_default_models_enabled:
          type: boolean
          description: Enable Arize's default model catalog. Defaults to false.
        model_names:
          type: array
          items:
            type: string
          description: Custom model names to make available. Defaults to none.
        auth:
          $ref: '#/components/schemas/CreateCustomAuth'
      additionalProperties: false
    CreateCustomDefaultAuth:
      type: object
      description: API-key auth. `api_key` is optional — a custom endpoint may require no credential at all. On PATCH this block replaces the stored auth wholesale, so omitting `api_key` clears any stored key rather than leaving it unchanged; send the key again to keep it.
      required:
        - auth_type
      properties:
        auth_type:
          type: string
          enum:
            - DEFAULT
          description: Discriminator identifying API-key auth.
        api_key:
          type: string
          description: API key for the endpoint (write-only, never returned).
      additionalProperties: false
    CreateCustomOauth2ClientCredentialsAuth:
      type: object
      description: 'Create OAuth 2.0 client-credentials auth (RFC 6749 section 4.4). Arize exchanges these credentials at `token_url` for a short-lived bearer token on each request to the endpoint. Mutually exclusive with a static `api_key`: supplying this auth block clears any stored API key.'
      required:
        - auth_type
        - token_url
        - client_id
        - client_secret
      properties:
        auth_type:
          type: string
          enum:
            - OAUTH2_CLIENT_CREDENTIALS
          description: Discriminator identifying OAuth 2.0 client-credentials auth.
        token_url:
          type: string
          description: Token endpoint Arize exchanges the client credentials at (HTTPS; validated server-side and must resolve to a public address).
        client_id:
          type: string
          description: OAuth client ID. Not a secret, so it is returned on read. Must not contain a colon, which is ambiguous in HTTP Basic authentication.
        client_secret:
          type: string
          description: OAuth client secret (write-only, never returned).
        scopes:
          type: string
          description: Space-separated scopes to request at the token endpoint. Defaults to not set.
        audience:
          type: string
          description: Audience to request at the token endpoint, required by some authorization servers. Defaults to not set.
      additionalProperties: false
    CreateEvaluatorIntegrationConfigInput:
      type: object
      description: |
        Write shape for the evaluator config on create. `headers` is encrypted at
        rest and never returned in responses; reads surface `has_headers`.
      required:
        - endpoint
        - input_schema
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS endpoint requests are sent to. Validated server-side and must resolve to a public address.
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Cleartext header map. Encrypted at rest; never returned in responses.
            Omitting this field on create means no headers are configured.
        input_schema:
          type: object
          additionalProperties: true
          description: |
            JSON Schema (Draft-07) the endpoint's request body conforms to. The
            root schema must have `type: object`, must not define the reserved
            top-level `arize_metadata` field, and must not exceed 64 KiB.
      additionalProperties: false
    CreateEvaluatorIntegrationRequest:
      type: object
      required:
        - type
        - name
        - config
      properties:
        type:
          type: string
          enum:
            - EVALUATOR
