            are declared. When a client omits `expression` on a single-filter create,
            GET echoes a synthesized expression equal to the lone query id (e.g. `A`).
      additionalProperties: false
      description: |
        Combined named-query filters and boolean expression for the trace/session
        shape. Supply this object OR `query_filter` (span shape) — not both.
      x-forward-compatible: true
    TaskQueryFiltersInput:
      type: object
      required:
        - filters
      properties:
        filters:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/TaskQueryFilterInput'
          description: |
            Named query filters (1-5 entries) with unique `A`-`E` ids. Each entry
            pairs a single-letter id with a filter expression.
        expression:
          type: string
          maxLength: 512
          description: |
            Boolean expression combining the `filters` ids (e.g. `A AND B`).
            Optional when exactly one filter is declared; required when two or more
            are declared.
      additionalProperties: false
      description: |
        Combined named-query filters and boolean expression for create/update requests
        (trace/session shape). Supply this object OR `query_filter` (span shape) — not both.
    TaskQueryMapping:
