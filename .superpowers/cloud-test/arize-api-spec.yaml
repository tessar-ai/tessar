          type: string
          minLength: 1
          maxLength: 255
          description: Full name of the new user
        email:
          allOf:
            - $ref: '#/components/schemas/Email'
          description: Email address of the user to invite
        role:
          $ref: '#/components/schemas/UserRoleAssignmentRequest'
        invite_mode:
          allOf:
            - $ref: '#/components/schemas/InviteMode'
