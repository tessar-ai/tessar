      properties:
        id:
          type: string
          description: Unique identifier for the space
        organization_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The unique identifier of the organization that contains the space. Older server versions may omit this field.
        name:
          type: string
          description: Name of the space
        description:
          type: string
          description: A brief description of the space's purpose
        created_at:
          type: string
          format: date-time
          description: Timestamp for when the space was created
        is_private:
          type: boolean
          description: |
            Whether the space is private. Private spaces are only visible to their
            members and account/org/space admins.
        default_llm_integration:
          $ref: '#/components/schemas/DefaultLLMIntegrationResponse'
          description: The default language model integration and model for the space.
        ml_models_enabled:
          type: boolean
          description: Whether machine learning models are enabled for the space.
        gradient_start_color:
          type: string
          description: The first color in the gradient used for the space's avatar.
        gradient_end_color:
          type: string
          description: The second color in the gradient used for the space's avatar.
        default_agent_runtime:
          $ref: '#/components/schemas/DefaultAgentRuntimeResponse'
          description: The default agent runtime integration for the space.
      description: |
        A space is a container within an organization for grouping related projects,
        datasets, and experiments. Spaces enable team collaboration or isolated
        experimentation with role-based access control.
      additionalProperties: false
      x-forward-compatible: true
    SpaceMembership:
      type: object
      description: |
        A space membership record.
      required:
