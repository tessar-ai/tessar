        - resource_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the role binding.
        role_id:
          $ref: '#/components/schemas/Id'
        user_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: |
            ID of the user this binding assigns the role to.

            For a **service key**, this is the ID of the key's bot user — not the ID of
            the person who created the key. Read it from `bot_user.id` on the
            `POST /v2/api-keys` response, or from `bot_user.id` on the matching service
            key entry returned by `GET /v2/api-keys`.
        resource_type:
          $ref: '#/components/schemas/RoleBindingResourceType'
        resource_id:
          $ref: '#/components/schemas/Id'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the binding was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the binding was last updated.
      additionalProperties: false
      x-forward-compatible: true
    RoleBindingResourceType:
      type: string
      enum:
        - SPACE
        - PROJECT
      description: |
        Resource type for the binding. Only `SPACE` and `PROJECT` are supported for
        single-binding CRUD. `resource_id` must encode the same resource type.
    UpdateRoleBindingRequest:
      type: object
      required:
        - role_id
      properties:
        role_id:
          $ref: '#/components/schemas/Id'
      additionalProperties: false
    CreateRoleRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9 \-_.,()[\]'"/:\\&@#$%!?+=]+$
          description: Human-readable name for the role. Must be unique within the account.
          example: AI Engineer
        description:
          type: string
          maxLength: 1000
          description: Optional description of the role's purpose. Omitted from the response if empty.
          example: Can read and create datasets and experiments but cannot manage spaces.
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Permission'
          description: |
            List of permissions to grant. At least one permission is required. Each value
            must be a valid permission identifier (e.g. `PROJECT_READ`, `DATASET_CREATE`).
          example:
            - PROJECT_READ
            - DATASET_READ
            - DATASET_CREATE
            - EXPERIMENT_READ
            - EXPERIMENT_CREATE
      additionalProperties: false
    Role:
      type: object
      required:
        - id
        - name
        - permissions
        - is_predefined
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the role.
        name:
          type: string
          description: Human-readable name of the role.
        description:
          type: string
          description: A brief description of the role's purpose.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: |
            List of permissions granted by this role. Each value corresponds to a
            permission identifier (e.g. `PROJECT_READ`, `DATASET_CREATE`).
            Returned only to callers with `ROLE_READ`.
        is_predefined:
          type: boolean
          description: |
            Whether this role is a system-defined predefined role. Predefined roles
            cannot be updated or deleted.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the role was created.
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the role was last updated.
      additionalProperties: false
      x-forward-compatible: true
    UpdateRoleRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9 \-_.,()[\]'"/:\\&@#$%!?+=]+$
          description: Updated name for the role. Must be unique within the account.
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Updated description of the role. Set to `null` to clear it.
        permissions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Permission'
          description: |
            Replacement set of permissions. When provided, the existing permissions are
            fully replaced. Each value must be a valid permission identifier.
      additionalProperties: false
    AddSpaceUserRequest:
