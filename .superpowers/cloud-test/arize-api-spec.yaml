    CreateEvaluatorRequestBody:
      description: |
        Body containing evaluator creation parameters with an initial version.

        `type: TEMPLATE`, `type: CODE`, and `type: REMOTE` are accepted on creation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEvaluatorRequest'
          examples:
            template_example:
              summary: Template evaluator
              value:
                space_id: U3BhY2U6NDkzOkJaSkc=
                name: Hallucination Eval
                description: Detects hallucinated content in LLM responses
                type: TEMPLATE
                version:
                  commit_message: Initial version
                  template_config:
                    name: hallucination
                    template: |-
                      You are an evaluation assistant. Given the following input and output, determine if the output contains hallucinated content.

                      Input: {input}
                      Output: {output}
                      Reference: {reference}
                    include_explanations: true
                    use_function_calling: true
                    classification_choices:
                      hallucinated: 0
                      factual: 1
                    direction: MAXIMIZE
                    data_granularity: SPAN
                    llm_config:
                      ai_integration_id: TGxtSW50ZWdyYXRpb246MTI6YUJjRA==
                      model_name: gpt-4o
                      invocation_parameters:
                        temperature: 0
                      provider_parameters: {}
            managed_code_example:
              summary: Managed code evaluator (CONTAINS_ALL_KEYWORDS)
              value:
                space_id: U3BhY2U6NDkzOkJaSkc=
                name: contains_all_keywords_eval
                description: Checks output contains all keywords
                type: CODE
                version:
                  commit_message: Initial version
                  code_config:
                    type: MANAGED
                    name: contains_all_keywords_eval
                    managed_evaluator: CONTAINS_ALL_KEYWORDS
                    variables:
                      - output
                    static_params:
                      - name: keywords
                        type: STRING_ARRAY
                        default_value:
                          - one
                          - two
                          - three
                    data_granularity: SPAN
            custom_code_example:
              summary: Custom Python code evaluator
              value:
                space_id: U3BhY2U6NDkzOkJaSkc=
                name: custom_eval
                description: Custom evaluator
                type: CODE
                version:
                  commit_message: Initial version
                  code_config:
                    type: CUSTOM
                    name: custom_eval
                    code: |
                      class MyEvaluator(CodeEvaluator):
                          def evaluate(self, *, input1=None, input2=None, **kwargs):
                              ...
                    imports: |
                      from typing import Any, Optional
                    variables:
                      - input1
                      - input2
                    static_params:
                      - name: foo
                        type: STRING
                        default_value: bar
                    data_granularity: SPAN
            remote_example:
              summary: Remote evaluator
              value:
                space_id: U3BhY2U6NDkzOkJaSkc=
                name: hosted_quality_eval
                description: Runs a customer-hosted quality evaluator
                type: REMOTE
                version:
                  commit_message: Initial version
                  remote_config:
                    integration_id: UmVtb3RlRW5kcG9pbnRJbnRlZ3JhdGlvbjo0Mg==
            invalid_type_mismatch:
              summary: Invalid - type does not match version config
              value:
                space_id: U3BhY2U6NDkzOkJaSkc=
                name: bad_example
                type: TEMPLATE
                version:
                  commit_message: Initial version
                  code_config:
                    type: MANAGED
                    name: bad_example
                    managed_evaluator: JSON_PARSEABLE
                    variables:
                      - output
              description: |
                Rejected by the server with 400 because `type: TEMPLATE` must be paired with
                `version.template_config`. The OpenAPI schema alone does not enforce the
                `type` ↔ `version` correlation; the server validates this.
    CreateEvaluatorVersionRequestBody:
      description: Body containing evaluator version creation parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEvaluatorVersionRequest'
          examples:
            template_example:
              summary: New template version
              value:
                commit_message: Improve template wording
                template_config:
                  name: hallucination
                  template: |-
                    Evaluate whether the output is factually grounded.

                    Input: {input}
                    Output: {output}
                  include_explanations: true
                  use_function_calling: true
                  classification_choices:
                    hallucinated: 0
                    factual: 1
                  direction: MAXIMIZE
                  data_granularity: SPAN
                  llm_config:
                    ai_integration_id: TGxtSW50ZWdyYXRpb246MTI6YUJjRA==
                    model_name: gpt-4o
                    invocation_parameters:
                      temperature: 0
                    provider_parameters: {}
            code_example:
              summary: New managed code version
              value:
                commit_message: Tune keywords
                code_config:
                  type: MANAGED
                  name: keywords_eval
                  managed_evaluator: CONTAINS_ANY_KEYWORD
                  variables:
                    - output
                  static_params:
                    - name: keywords
                      type: STRING_ARRAY
                      default_value:
                        - alpha
                        - beta
    DeleteEvaluatorVersionsRequestBody:
      required: true
