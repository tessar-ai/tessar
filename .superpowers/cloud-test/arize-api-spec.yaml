      responses:
        '200':
          $ref: '#/components/responses/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    patch:
      x-release-status: alpha
      tags:
        - Webhooks
      operationId: update_webhook
      summary: Update a webhook
      description: |
        Update a webhook by its ID. At least one field must be provided.

        **Payload Requirements**
        - At least one of `name`, `description`, `url`, `auth_token`,
          `timeout_ms`, or `headers` must be provided.
        - If `name` is provided, it must be unique within the organization
          (409 on conflict).
        - `headers` replaces the whole header map. Write-only: header values
          are never returned.
        - `auth_type` cannot be changed after creation, and the signing secret
          of an `HMAC_SHA256` webhook cannot be rotated — create a new webhook
          instead.
        - System-managed fields (`id`, `created_at`, `updated_at`) cannot be
          modified.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/WebhookIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/UpdateWebhookRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/Webhook'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    delete:
      x-release-status: alpha
      tags:
        - Webhooks
      operationId: delete_webhook
      summary: Delete a webhook
      description: |
        Delete a webhook by its ID. The webhook stops receiving events and is
        detached from every prompt, evaluator, and monitor it was subscribed
        to. This operation is irreversible.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/WebhookIdPathParam'
      responses:
        '204':
          $ref: '#/components/responses/DeleteWebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/webhooks/{webhook_id}/delivery-attempts:
    get:
      x-release-status: alpha
      tags:
        - Webhooks
      operationId: list_webhook_delivery_attempts
      summary: List a webhook's delivery attempts
      description: |
        List the webhook's delivery attempts, most recent first. Each event
        may have several attempts, since failed deliveries are retried.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/WebhookIdPathParam'
        - $ref: '#/components/parameters/LimitQueryParamLarge'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/ListWebhookDeliveryAttemptsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/webhooks/{webhook_id}/test:
    post:
      x-release-status: alpha
      tags:
        - Webhooks
      operationId: test_webhook
      summary: Send a test event to a webhook
      description: |
        Send a test event to the webhook's endpoint and report the outcome.
        Use this to verify the endpoint is reachable and accepts deliveries
        before subscribing the webhook to real events.

        A 200 response means the test ran — check `status_code` and
        `error_message` in the body for the endpoint's actual outcome.
        A 404 means the destination was not available to receive a test.
        A 503 means the test could not be sent; retry later.

        Test deliveries are not supported for `HMAC_SHA256` webhooks; those
        requests fail with a 400.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/WebhookIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/TestWebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    AiIntegration:
      type: object
      required:
        - id
        - name
        - provider
        - has_api_key
        - enable_default_models
        - function_calling_enabled
        - auth_type
        - scopings
        - created_at
        - updated_at
        - created_by_user_id
      properties:
        id:
          type: string
          description: The integration ID
        name:
          type: string
          description: The integration name
        provider:
          $ref: '#/components/schemas/AiIntegrationProvider'
        has_api_key:
          type: boolean
          description: Whether an API key is configured (the key itself is never returned)
        base_url:
          type: string
          nullable: true
          description: Custom base URL for the provider
        model_names:
          type: array
          nullable: true
          items:
            type: string
          description: Supported model names
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Custom headers included in requests
        enable_default_models:
          type: boolean
          description: Whether the provider's default model list is enabled
        function_calling_enabled:
          type: boolean
          description: Whether function/tool calling is enabled
        auth_type:
          $ref: '#/components/schemas/AiIntegrationAuthType'
        provider_metadata:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProviderMetadata'
          description: Provider-specific configuration. For AWS_BEDROCK, must include role_arn. For VERTEX_AI, must include project_id, location, and project_access_label.
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/AiIntegrationScoping'
          description: Visibility scoping rules
        created_at:
          type: string
          format: date-time
          description: When the integration was created
        updated_at:
          type: string
          format: date-time
          description: When the integration was last updated
        created_by_user_id:
          type: string
          description: The user ID of the user who created the integration
      description: |
        An AI integration configures access to an external LLM provider (e.g. OpenAI,
        Azure OpenAI, AWS Bedrock, Vertex AI). Integrations can be scoped to the entire
        account, a specific organization, or a specific space.
      additionalProperties: false
      x-forward-compatible: true
    AiIntegrationAuthType:
      type: string
      enum:
        - DEFAULT
        - PROXY_WITH_HEADERS
        - BEARER_TOKEN
        - OAUTH2_CLIENT_CREDENTIALS
      description: The authentication method for this integration. `OAUTH2_CLIENT_CREDENTIALS` is returned for integrations configured with OAuth 2.0 client credentials in the Arize UI. Setting it through this API is not yet supported.
    AiIntegrationProvider:
      type: string
      enum:
        - OPEN_AI
        - AZURE_OPEN_AI
        - AWS_BEDROCK
        - VERTEX_AI
        - ANTHROPIC
        - CUSTOM
        - NVIDIA_NIM
        - GEMINI
        - LITELLM
        - FIREWORKS
        - TOGETHER_AI
      description: The AI provider for this integration
    AiIntegrationScoping:
      type: object
      description: Visibility scoping for the integration
      properties:
        organization_id:
          type: string
          nullable: true
          description: Organization identifier (base64). Null means account-wide.
        space_id:
          type: string
          nullable: true
          description: Space identifier (base64). Null means organization-wide (or account-wide if organization_id is also null).
      additionalProperties: false
      x-forward-compatible: true
    AiIntegrationScopingRequest:
      type: object
      description: Visibility scoping for the integration in a write request (strict form of AiIntegrationScoping).
      properties:
        organization_id:
          type: string
          nullable: true
          description: Organization identifier (base64). Null means account-wide.
        space_id:
          type: string
          nullable: true
          description: Space identifier (base64). Null means organization-wide (or account-wide if organization_id is also null).
      additionalProperties: false
    AwsProviderMetadata:
      type: object
      description: AWS Bedrock provider metadata
      required:
        - kind
        - role_arn
      properties:
        kind:
          $ref: '#/components/schemas/AwsProviderMetadataKind'
        role_arn:
          type: string
          description: AWS IAM role ARN for cross-account access
        external_id:
          type: string
          nullable: true
          description: External ID for the assume-role policy
      additionalProperties: false
      x-forward-compatible: true
    AwsProviderMetadataRequest:
      type: object
      description: AWS Bedrock provider metadata in a write request (strict form of AwsProviderMetadata).
      required:
        - kind
        - role_arn
      properties:
        kind:
          $ref: '#/components/schemas/AwsProviderMetadataKind'
        role_arn:
          type: string
          description: AWS IAM role ARN for cross-account access
        external_id:
          type: string
          nullable: true
          description: External ID for the assume-role policy
      additionalProperties: false
    CreateAiIntegrationRequest:
      type: object
      required:
        - name
        - provider
      properties:
        name:
          type: string
          description: Integration name
        provider:
          $ref: '#/components/schemas/AiIntegrationProvider'
        api_key:
          type: string
          description: API key for the provider (write-only, never returned)
        base_url:
          type: string
          description: Custom base URL for the provider
        model_names:
          type: array
          items:
            type: string
          description: Supported model names
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom headers to include in requests. The serialized header map must not exceed 8,175 bytes.
        enable_default_models:
          type: boolean
          description: Enable provider's default model list (default false)
        function_calling_enabled:
          type: boolean
          description: Enable function/tool calling (default true)
        auth_type:
          $ref: '#/components/schemas/AiIntegrationAuthType'
        provider_metadata:
          $ref: '#/components/schemas/ProviderMetadataRequest'
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/AiIntegrationScopingRequest'
          description: Visibility scoping rules. Defaults to account-wide.
      additionalProperties: false
    GcpProviderMetadata:
      type: object
      description: Vertex AI (GCP) provider metadata
      required:
        - kind
        - project_id
        - location
        - project_access_label
      properties:
        kind:
          $ref: '#/components/schemas/GcpProviderMetadataKind'
        project_id:
          type: string
          description: GCP project ID
        location:
          type: string
          description: GCP region (e.g. us-central1)
        project_access_label:
          type: string
          description: Display label for the project
      additionalProperties: false
      x-forward-compatible: true
    GcpProviderMetadataRequest:
      type: object
      description: Vertex AI (GCP) provider metadata in a write request (strict form of GcpProviderMetadata).
      required:
        - kind
        - project_id
        - location
        - project_access_label
      properties:
        kind:
          $ref: '#/components/schemas/GcpProviderMetadataKind'
        project_id:
          type: string
          description: GCP project ID
        location:
          type: string
          description: GCP region (e.g. us-central1)
        project_access_label:
          type: string
          description: Display label for the project
      additionalProperties: false
    ProviderMetadata:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          AWS: '#/components/schemas/AwsProviderMetadata'
          GCP: '#/components/schemas/GcpProviderMetadata'
      oneOf:
        - $ref: '#/components/schemas/AwsProviderMetadata'
        - $ref: '#/components/schemas/GcpProviderMetadata'
      description: Provider-specific configuration. For AWS_BEDROCK, must include role_arn. For VERTEX_AI, must include project_id, location, and project_access_label.
    ProviderMetadataRequest:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          AWS: '#/components/schemas/AwsProviderMetadataRequest'
          GCP: '#/components/schemas/GcpProviderMetadataRequest'
      oneOf:
        - $ref: '#/components/schemas/AwsProviderMetadataRequest'
        - $ref: '#/components/schemas/GcpProviderMetadataRequest'
      description: Strict request form of ProviderMetadata. For AWS_BEDROCK, must include role_arn. For VERTEX_AI, must include project_id, location, and project_access_label.
    UpdateAiIntegrationRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          description: New integration name
        provider:
          $ref: '#/components/schemas/AiIntegrationProvider'
        api_key:
          type: string
          nullable: true
          description: New API key. Pass null to remove the existing key. Omit to keep unchanged.
        base_url:
          type: string
          nullable: true
          description: Custom base URL. Pass null to remove.
        model_names:
          type: array
          items:
            type: string
          description: Supported model names (replaces all)
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Custom headers. Pass null to remove. The serialized header map must not exceed 8,175 bytes.
        enable_default_models:
          type: boolean
          description: Enable provider's default model list
        function_calling_enabled:
          type: boolean
          description: Enable function/tool calling
        auth_type:
          $ref: '#/components/schemas/AiIntegrationAuthType'
        provider_metadata:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProviderMetadataRequest'
          description: Provider-specific configuration. For AWS_BEDROCK, must include role_arn. For VERTEX_AI, must include project_id, location, and project_access_label. Pass null to remove.
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/AiIntegrationScopingRequest'
          description: Visibility scoping rules (replaces all existing scopings)
      additionalProperties: false
    AnnotationConfig:
      type: object
      additionalProperties: true
      discriminator:
        propertyName: type
        mapping:
          CONTINUOUS: '#/components/schemas/ContinuousAnnotationConfig'
          CATEGORICAL: '#/components/schemas/CategoricalAnnotationConfig'
          FREEFORM: '#/components/schemas/FreeformAnnotationConfig'
      oneOf:
        - $ref: '#/components/schemas/ContinuousAnnotationConfig'
        - $ref: '#/components/schemas/CategoricalAnnotationConfig'
        - $ref: '#/components/schemas/FreeformAnnotationConfig'
    CreateAnnotationConfigRequest:
      required:
        - name
        - space_id
        - annotation_config_type
      properties:
        annotation_config_type:
          $ref: '#/components/schemas/AnnotationConfigType'
      discriminator:
        propertyName: annotation_config_type
        mapping:
          CONTINUOUS: '#/components/schemas/CreateContinuousAnnotationConfigRequest'
          CATEGORICAL: '#/components/schemas/CreateCategoricalAnnotationConfigRequest'
          FREEFORM: '#/components/schemas/CreateFreeformAnnotationConfigRequest'
      oneOf:
        - $ref: '#/components/schemas/CreateContinuousAnnotationConfigRequest'
        - $ref: '#/components/schemas/CreateCategoricalAnnotationConfigRequest'
        - $ref: '#/components/schemas/CreateFreeformAnnotationConfigRequest'
    UpdateAnnotationConfigRequest:
      required:
        - annotation_config_type
      properties:
        annotation_config_type:
          $ref: '#/components/schemas/AnnotationConfigType'
      discriminator:
        propertyName: annotation_config_type
        mapping:
          CONTINUOUS: '#/components/schemas/UpdateContinuousAnnotationConfigRequest'
          CATEGORICAL: '#/components/schemas/UpdateCategoricalAnnotationConfigRequest'
          FREEFORM: '#/components/schemas/UpdateFreeformAnnotationConfigRequest'
      oneOf:
        - $ref: '#/components/schemas/UpdateContinuousAnnotationConfigRequest'
        - $ref: '#/components/schemas/UpdateCategoricalAnnotationConfigRequest'
        - $ref: '#/components/schemas/UpdateFreeformAnnotationConfigRequest'
    AddAnnotationQueueRecordsRequest:
      type: object
      required:
        - record_sources
      properties:
        record_sources:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/AnnotationQueueRecordInput'
          description: Record sources to add to the annotation queue. At most 2 record sources (projects or datasets) may be provided in a single request. The total number of records resolved from all sources must not exceed 500. The total number of session records across all sources must not exceed 100.
      additionalProperties: false
    AnnotateAnnotationQueueRecordRequest:
      type: object
      description: Annotations to submit for an annotation queue record. Annotations are upserted by annotation config name; omitted configs are left unchanged.
      required:
        - annotations
      properties:
        annotations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/AnnotationInput'
          description: Annotations to upsert on this record, keyed by annotation config name. At most 500 annotations may be submitted per request — one per annotation config associated with the queue.
      additionalProperties: false
    AnnotateAnnotationQueueRecordResponse:
      type: object
      description: A snapshot of the annotation queue record fields that were modified by an annotate operation. Only the record identity fields and the submitted annotations are returned. Evaluations and user assignments are not fetched and are not included in this response for performance reasons; use the list records endpoint to retrieve the full record state.
      required:
        - id
        - annotation_queue_id
        - source_type
        - annotations
      properties:
        id:
          type: string
          description: The unique identifier for the record
        annotation_queue_id:
          type: string
          description: The annotation queue this record belongs to
        source_type:
          $ref: '#/components/schemas/AnnotationQueueSourceType'
        granularity:
          allOf:
            - $ref: '#/components/schemas/RecordGranularity'
          nullable: true
          description: The granularity of the record, if applicable.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: The annotations that were submitted in this request
      additionalProperties: false
      x-forward-compatible: true
    AnnotationQueue:
      type: object
      required:
        - id
        - name
        - space_id
        - annotators
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: The unique identifier for the annotation queue
          example: aq_abc123
        name:
          type: string
          description: The name of the annotation queue
          example: Quality Review Queue
        space_id:
          type: string
          description: The space id the annotation queue belongs to
          example: spc_xyz789
        instructions:
          type: string
          nullable: true
          description: The instructions for the annotation queue
          example: Review each response for accuracy and helpfulness
        annotation_configs:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationConfig'
          description: The annotation configs associated with this queue
        annotators:
          type: array
          items:
            $ref: '#/components/schemas/AnnotatorUser'
          description: Users assigned as annotators to this queue
        created_at:
          type: string
          format: date-time
          description: The timestamp for when the annotation queue was created
          example: '2024-01-15T10:30:00Z'
        updated_at:
          type: string
          format: date-time
          description: The timestamp for when the annotation queue was last updated
          example: '2024-01-20T14:45:00Z'
        column_allowlist:
          type: array
          items:
            type: string
          nullable: true
          description: |
            The record column names annotators assigned to this queue are allowed to see.
            Absent or `null` means the queue is unrestricted and annotators see every column.
          example:
            - context.trace_id
            - attributes.llm.input_messages
            - column with spaces
      additionalProperties: false
      x-forward-compatible: true
    AnnotationQueueAssignedUser:
      type: object
      description: A user assigned to a record with their completion status
      required:
        - user
        - completion_status
      properties:
        user:
          $ref: '#/components/schemas/AnnotatorUser'
        completion_status:
          $ref: '#/components/schemas/AnnotationQueueCompletionStatus'
      additionalProperties: false
      x-forward-compatible: true
    AnnotationQueueCompletionStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
      description: |
        Completion status for a user's annotation assignment on a record.
        - PENDING - The user has not yet submitted annotations.
        - COMPLETED - The user has submitted annotations.
    AnnotationQueueExampleRecordInput:
      type: object
      required:
        - record_type
        - dataset_id
      properties:
        record_type:
          type: string
          enum:
            - EXAMPLE
          description: Discriminator identifying this record source as dataset examples. Must be `EXAMPLE` for dataset example records.
        dataset_id:
          type: string
          description: The dataset ID these examples belong to
        dataset_version_id:
          type: string
          description: |
            Optional. The specific dataset version to use. If omitted, the latest version is used.
        example_ids:
          type: array
          maxItems: 500
          items:
            type: string
          uniqueItems: true
          description: |
            Optional. List of example IDs within the dataset to add to the queue. If omitted, all examples in the dataset (or dataset version) are added, provided the total records from all sources does not exceed 500.
      additionalProperties: false
    AnnotationQueueRecord:
      type: object
      description: A record in an annotation queue with its data
      required:
        - id
        - annotation_queue_id
        - source_type
        - data
        - annotations
        - trace_annotations
        - session_annotations
        - evaluations
        - assigned_users
      properties:
        id:
          type: string
          description: The unique identifier for the record
        annotation_queue_id:
          type: string
          description: The annotation queue this record belongs to
        source_type:
          $ref: '#/components/schemas/AnnotationQueueSourceType'
        granularity:
          allOf:
            - $ref: '#/components/schemas/RecordGranularity'
          nullable: true
          description: The granularity of the record, if applicable.
        data:
          type: object
          additionalProperties: true
          description: Record data as flat key-value pairs containing span or dataset fields. Does not include annotation or evaluation columns.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: Annotations on this record.
        trace_annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: Trace annotations on this record.
        session_annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: Session annotations on this record.
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
          description: Evaluation results on this record
        assigned_users:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationQueueAssignedUser'
          description: Users assigned to this record
      additionalProperties: false
      x-forward-compatible: true
    AnnotationQueueRecordInput:
      oneOf:
        - $ref: '#/components/schemas/AnnotationQueueExampleRecordInput'
        - $ref: '#/components/schemas/AnnotationQueueSpanRecordInput'
        - $ref: '#/components/schemas/AnnotationQueueTraceRecordInput'
        - $ref: '#/components/schemas/AnnotationQueueSessionRecordInput'
      discriminator:
        propertyName: record_type
        mapping:
          EXAMPLE: '#/components/schemas/AnnotationQueueExampleRecordInput'
          SPAN: '#/components/schemas/AnnotationQueueSpanRecordInput'
          TRACE: '#/components/schemas/AnnotationQueueTraceRecordInput'
          SESSION: '#/components/schemas/AnnotationQueueSessionRecordInput'
    AnnotationQueueSourceType:
      type: string
      enum:
        - SPANS
        - DATASET
      description: |
        Source type of the annotation queue record.
        - SPANS - The record originates from span data.
        - DATASET - The record originates from a dataset example.
    AnnotationQueueSpanRecordInput:
      type: object
      required:
        - record_type
        - project_id
        - span_ids
        - start_time
        - end_time
      properties:
        record_type:
          type: string
          enum:
            - SPAN
          description: Discriminator identifying this record source as project spans. Must be `SPAN` for span records.
        project_id:
          type: string
          description: The project ID these spans belong to
        start_time:
          type: string
          format: date-time
          description: |
            Start of the time range to search for spans. The range (end_time - start_time) must not exceed 7 days.
        end_time:
          type: string
          format: date-time
          description: |
            End of the time range. Must be after start_time.
        span_ids:
          type: array
          maxItems: 500
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: List of span IDs to add to the queue
      additionalProperties: false
    AnnotationQueueTraceRecordInput:
      type: object
      required:
        - record_type
        - project_id
        - trace_ids
        - start_time
        - end_time
      properties:
        record_type:
          type: string
          enum:
            - TRACE
          description: Discriminator identifying this record as a trace record.
        project_id:
          type: string
          description: The project ID these traces belong to.
        start_time:
          type: string
          format: date-time
          description: |
            Start of the time range used to resolve each trace's root span. The range (end_time - start_time) must not exceed 7 days.
        end_time:
          type: string
          format: date-time
          description: |
            End of the time range. Must be after start_time.
        trace_ids:
          type: array
          maxItems: 500
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: |
            List of trace IDs to add to the queue.
      additionalProperties: false
    AssignAnnotationQueueRecordRequest:
      type: object
      description: User assignment for an annotation queue record. Fully replaces the current record-level user assignment. Pass an empty array to remove all assignments.
      required:
        - assigned_user_emails
      properties:
        assigned_user_emails:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Email'
          description: Emails of users to assign to this record. Replaces the current record-level user assignment entirely. At most 100 emails may be provided per request.
          example:
            - reviewer@example.com
            - annotator@example.com
      additionalProperties: false
    AssignAnnotationQueueRecordResponse:
      type: object
      description: A snapshot of the annotation queue record fields that were modified by an assign operation. Only the record identity fields and the resulting user assignments are returned. Annotations and evaluations are not fetched and are not included in this response for performance reasons; use the list records endpoint to retrieve the full record state.
      required:
        - id
        - annotation_queue_id
        - source_type
        - assigned_users
      properties:
        id:
          type: string
          description: The unique identifier for the record
        annotation_queue_id:
          type: string
          description: The annotation queue this record belongs to
        source_type:
          $ref: '#/components/schemas/AnnotationQueueSourceType'
        granularity:
          allOf:
            - $ref: '#/components/schemas/RecordGranularity'
          nullable: true
          description: The granularity of the record, if applicable.
        assigned_users:
          type: array
          items:
            $ref: '#/components/schemas/AnnotationQueueAssignedUser'
          description: The users now assigned to this record after this operation
      additionalProperties: false
      x-forward-compatible: true
    CreateAnnotationQueueRequest:
      type: object
      required:
        - name
        - space_id
        - annotation_config_ids
        - annotator_emails
      properties:
        name:
          type: string
          maxLength: 255
          description: The name of the annotation queue. Must be unique within the space for active queues.
          example: Quality Review Queue
        space_id:
          type: string
          description: The space ID that the annotation queue belongs to
          example: spc_xyz789
        instructions:
          type: string
          maxLength: 5000
          description: Instructions for annotators working on this queue
          example: Review each response for accuracy and helpfulness
        annotation_config_ids:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
          description: IDs of annotation configs to associate with this queue. All configs must belong to the same space.
          example:
            - ac_abc123
            - ac_def456
        annotator_emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
          minItems: 1
          description: Email addresses of annotators to assign to the queue. Emails are resolved to user IDs server-side.
          example:
            - annotator1@example.com
            - annotator2@example.com
        assignment_method:
          allOf:
            - $ref: '#/components/schemas/AssignmentMethod'
          default: ALL
          description: How records are assigned to annotators. Defaults to `ALL` when omitted.
        record_sources:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AnnotationQueueRecordInput'
          description: Record sources to add to the annotation queue on creation. At most 2 record sources (projects or datasets) may be provided in a single create request. The total number of records resolved from all sources must not exceed 500. The total number of session records across all sources must not exceed 100. Additional records from other sources can be added after creation.
        column_allowlist:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 512
          description: |
            The record column names annotators assigned to this queue are allowed to see.
            Omit or send an empty list to leave the queue unrestricted, so annotators see every
            column. Because this is an allowlist, columns introduced by records added to the
            queue later stay hidden until an admin allows them.
          example:
            - context.trace_id
            - attributes.llm.input_messages
            - column with spaces
      additionalProperties: false
    DeleteAnnotationQueueRecordsRequest:
      type: object
      required:
        - record_ids
      properties:
        record_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
          description: The IDs of the annotation queue records to delete.
      additionalProperties: false
    RecordGranularity:
      type: string
      enum:
        - SPAN
        - TRACE
        - SESSION
      description: |
        Granularity of an annotation queue record.
        - SPAN: The record represents a span.
        - TRACE: The record represents a trace.
        - SESSION: The record represents a session.
    UpdateAnnotationQueueRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The name of the annotation queue. Must be unique within the space.
          example: Updated Queue Name
        instructions:
          type: string
          minLength: 1
          maxLength: 5000
          nullable: true
          description: |
            The instructions for annotators working on this queue.
            Set to `null` to clear the instructions.
          example: Review each response for accuracy and helpfulness
        annotation_config_ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: |
            The full list of annotation config IDs to associate with this queue.
            This replaces all existing annotation config associations.
            All annotation configs must belong to the same space as the queue.
          example:
            - ac_abc123
            - ac_def456
        annotator_emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
          description: |
            The full list of user emails to assign to this queue.
            This replaces all existing user assignments.
            All users must have an active account and access to the queue's space.
          example:
            - reviewer@example.com
            - annotator@example.com
        column_allowlist:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 512
          nullable: true
          description: |
            The full list of record column names annotators assigned to this queue are allowed
            to see. This replaces the existing allowlist. Set to `null` to remove the
            restriction so annotators see every column. Omit to leave it unchanged.
          example:
            - context.trace_id
            - attributes.llm.input_messages
            - column with spaces
    AnnotateDatasetExamplesRequest:
      type: object
      description: Batch annotation request for dataset examples.
      required:
        - annotations
      properties:
        annotations:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AnnotateRecordInput'
          description: Batch of dataset example annotations to write. Up to 1000 examples per request.
      additionalProperties: false
    AnnotateExperimentRunsRequest:
      type: object
      description: Batch annotation request for experiment runs.
      required:
        - annotations
      properties:
        annotations:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AnnotateRecordInput'
          description: Batch of experiment run annotations to write. Up to 1000 runs per request.
      additionalProperties: false
    AnnotateRecordInput:
      type: object
      description: A single record to annotate in a batch, identified by its record ID.
      required:
        - record_id
        - values
      properties:
        record_id:
          type: string
          description: The record identifier — a span ID, session ID, dataset example ID, or experiment run ID, depending on the endpoint and (for spans) the `granularity` field.
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AnnotationInput'
          description: One or more annotation values to set on this record.
      additionalProperties: false
    AnnotateRecordResult:
      type: object
      description: The annotation result for a single annotated record.
      required:
        - record_id
        - annotations
      properties:
        record_id:
          type: string
          description: The record identifier — a span ID, session ID, dataset example ID, or experiment run ID, depending on the endpoint and (for spans) the `granularity` field.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: The annotations that were written to this record.
      additionalProperties: false
      x-forward-compatible: true
    AnnotateSpansRequest:
      type: object
      description: Batch annotation request for project spans.
      required:
        - project_id
        - annotations
      properties:
        project_id:
          type: string
          description: The project (model) ID whose spans are being annotated.
          example: proj_abc123
        start_time:
          type: string
          format: date-time
          description: Start of the time range for span lookup. Optional; defaults to 31 days before end_time, or 7 days before end_time when granularity is SESSION.
          example: '2024-01-01T00:00:00Z'
        end_time:
          type: string
          format: date-time
          description: End of the time range for span lookup. Optional; defaults to now.
          example: '2024-01-08T00:00:00Z'
        granularity:
          allOf:
            - $ref: '#/components/schemas/RecordGranularity'
          default: SPAN
          description: Whether the record is a span, a trace, or a session, which affects whether annotations are written as span, trace, or session annotations. For TRACE, each `record_id` must be a trace's root span; attempts to write trace annotations on non-root spans will be rejected. For SESSION, each `record_id` is a session ID; the annotation is written to the root span of the session's earliest trace within the lookup window. Optional; defaults to 'SPAN'.
        annotations:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/AnnotateRecordInput'
          description: Batch of annotations to write. Up to 1000 records per request for SPAN or TRACE granularity; up to 100 records per request for SESSION granularity.
      additionalProperties: false
    Annotation:
      type: object
      description: A human annotation on a record.
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the annotation
        score:
          type: number
          format: double
          description: Numeric score for the annotation
        label:
          type: string
          description: Categorical label for the annotation
        text:
          type: string
          description: Free-form text note for the annotation
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the annotation was last updated
        annotator:
          allOf:
            - $ref: '#/components/schemas/AnnotatorUser'
          description: The user who made this annotation
      additionalProperties: false
      x-forward-compatible: true
    AnnotationBatchResult:
      type: object
      description: Result of a batch annotation operation. Contains one result entry per annotated record.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AnnotateRecordResult'
          description: Per-record annotation results, in the same order as the request.
      additionalProperties: false
      x-forward-compatible: true
    AnnotationInput:
      type: object
      description: An annotation value to set on a record, identified by its annotation config name. Omitting a field leaves the existing value unchanged.
      required:
        - name
      properties:
        name:
          type: string
          description: The annotation config name
          example: accuracy
        score:
          type: number
          format: double
          description: Numeric score for the annotation. Omit to leave unchanged.
        label:
          type: string
          description: Categorical label for the annotation. Omit to leave unchanged.
        text:
          type: string
          description: Free-form text note for the annotation. Omit to leave unchanged.
      additionalProperties: false
    ApiKey:
      oneOf:
        - $ref: '#/components/schemas/UserApiKey'
        - $ref: '#/components/schemas/ServiceApiKey'
      discriminator:
        propertyName: key_type
        mapping:
          USER: '#/components/schemas/UserApiKey'
          SERVICE: '#/components/schemas/ServiceApiKey'
      description: |
        An API key as returned by `GET /v2/api-keys`. The `key_type` field discriminates the variant:
        - `USER` — standard user key; no bot user.
        - `SERVICE` — service key tied to a service account; includes a `bot_user` with the
          service account's resolved role assignments.
    ApiKeyStatus:
      type: string
      enum:
        - ACTIVE
        - REVOKED
      description: |
        Current status of the API key.
        - ACTIVE - The key is valid for use.
        - REVOKED - The key has been revoked and is no longer valid.
    ApiKeyType:
      type: string
      enum:
        - USER
        - SERVICE
      description: |
        Type of the API key.
        - USER - Personal key that authenticates as the creating user.
        - SERVICE - Key that authenticates as a service account with explicitly granted access.
    CreateApiKeyRequest:
      required:
        - key_type
      properties:
        key_type:
          allOf:
            - $ref: '#/components/schemas/ApiKeyType'
          description: |
            The type of key to create. Use `"USER"` for a personal key that authenticates
            as you with your current permissions. Use `"SERVICE"` for a key tied to a
            dedicated service account with its own explicitly configured access across
            one or more spaces.
      discriminator:
        propertyName: key_type
        mapping:
          USER: '#/components/schemas/CreateUserApiKeyRequest'
          SERVICE: '#/components/schemas/CreateServiceApiKeyRequest'
      oneOf:
        - $ref: '#/components/schemas/CreateUserApiKeyRequest'
        - $ref: '#/components/schemas/CreateServiceApiKeyRequest'
      description: |
        Request body for creating an API key. Set `key_type` to select the kind of key:
        - `USER` — authenticates as the creating user, inheriting their current permissions.
        - `SERVICE` — authenticates as a service account: a dedicated, automatically provisioned
          identity with roles explicitly configured in the spaces you specify. Use this for
          automation, CI/CD pipelines, or any workload that should run independently of a
          specific user.
    CreateApiKeyResponse:
      oneOf:
        - $ref: '#/components/schemas/CreatedUserApiKey'
        - $ref: '#/components/schemas/CreatedServiceApiKey'
      discriminator:
        propertyName: key_type
        mapping:
          USER: '#/components/schemas/CreatedUserApiKey'
          SERVICE: '#/components/schemas/CreatedServiceApiKey'
      description: |
        Response for a newly created or refreshed API key. The `key_type` field discriminates the variant:
        - `USER` — standard user key; no bot user.
        - `SERVICE` — service key tied to a service account; includes a `bot_user` with the service account's resolved role assignments.
    CreateServiceApiKeyRequest:
      type: object
      required:
        - key_type
        - name
        - organizations
      properties:
        key_type:
          type: string
          enum:
            - SERVICE
          description: Must be `"SERVICE"`.
        name:
          type: string
          maxLength: 256
          description: User-defined name for the API key.
          example: CI pipeline key
        description:
          type: string
          maxLength: 1000
          description: Optional user-defined description for the API key.
          example: Key used by the CI pipeline to upload evaluation results.
        expires_at:
          type: string
          format: date-time
          description: Optional expiration timestamp. If omitted the key never expires.
          example: '2026-01-01T00:00:00Z'
        account_role:
          allOf:
            - $ref: '#/components/schemas/UserRoleAssignmentRequest'
          default:
            type: PREDEFINED
            name: MEMBER
          description: |
            Account-level role for the bot user. Only predefined roles are supported at this level.
            Custom account roles (`{ "type": "CUSTOM", "id": "..." }`) are not yet supported and return `422`.
            Support will be added in a future release.
            Defaults to `{ type: PREDEFINED, name: MEMBER }` when omitted.
            Must be at or below the caller's own account role.
            The `MEMBER_UI_ONLY` and `ANNOTATOR` roles are not valid for service keys and return `400`.
        organizations:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: |
            Organizations the service account should have access to. Each entry specifies an organization
            and the spaces within it. Must include at least one organization with at least one space.
            All spaces must belong to the organization they are listed under.
          items:
            $ref: '#/components/schemas/ServiceKeyOrgAssignment'
      additionalProperties: false
    CreateUserApiKeyRequest:
      type: object
      required:
        - key_type
        - name
      properties:
        key_type:
          type: string
          enum:
            - USER
          description: Must be `"USER"`.
        name:
          type: string
          maxLength: 256
          description: User-defined name for the API key.
          example: My dev key
        description:
          type: string
          maxLength: 1000
          description: Optional user-defined description for the API key.
          example: Used for local development.
        expires_at:
          type: string
          format: date-time
          description: Optional expiration timestamp. If omitted the key never expires.
          example: '2026-01-01T00:00:00Z'
      additionalProperties: false
    CreatedServiceApiKey:
      x-forward-compatible: true
      allOf:
        - $ref: '#/components/schemas/ServiceApiKey'
        - type: object
          required:
            - key
            - bot_user
          properties:
            key:
              type: string
              description: |
                The full API key value. **Only returned once** at creation or refresh time.
                Store it securely — it cannot be retrieved again.
            bot_user:
              $ref: '#/components/schemas/CreatedServiceKeyBotUser'
              description: |
                The bot user created for this service key, including its resolved role
                assignments. Creating a service key always assigns at least one organization.
    CreatedServiceKeyBotUser:
      type: object
      required:
        - id
        - name
        - account_role
        - organizations
      properties:
        id:
          type: string
          description: Global ID of the bot user.
        name:
          type: string
          description: Display name of the bot user.
        account_role:
          allOf:
            - $ref: '#/components/schemas/UserRoleAssignment'
          description: Account-level role assigned to the bot user. Always present — defaults are resolved server-side.
        organizations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ServiceKeyBotUserOrgAssignment'
          description: |
            Organization access assignments for the service account, each containing nested
            space assignments. Always has at least one entry — creating a service key requires
            at least one organization.
      additionalProperties: false
      x-forward-compatible: true
    CreatedUserApiKey:
      x-forward-compatible: true
      allOf:
        - $ref: '#/components/schemas/UserApiKey'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              description: |
                The full API key value. **Only returned once** at creation or refresh time.
                Store it securely — it cannot be retrieved again.
    ListApiKeysResponse:
      type: object
      required:
        - api_keys
        - pagination
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
          description: API keys matching the request filters.
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
          description: Pagination metadata for cursor-based navigation.
      additionalProperties: false
      x-forward-compatible: true
    RefreshApiKeyRequest:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          description: |
            Expiration timestamp for the refreshed key. Required when the existing key
            has an expiry — omitting it would extend the key's lifetime to unbounded,
            which is rejected with 422. For an unbounded existing key, `expires_at` may
            be omitted (the refreshed key is also unbounded) or provided to add a
            specific expiry. The value must be no later than the old key's expiry — a
            request that would extend the key's lifetime is rejected with 422. To create
            a key with a longer lifetime, use `POST /v2/api-keys` to issue a new key
            rather than refreshing.
          example: '2027-01-01T00:00:00Z'
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: |
            Grace period in seconds during which the old key remains valid after the
            refresh. When set, the old key's expiration is updated to `now + grace_period_seconds`
            instead of being immediately revoked — it expires naturally at the end of the window.
            If the old key already has an `expires_at` that is sooner than the grace window end,
            the shorter value is used (the grace period cannot extend a key's original lifetime).
            Defaults to 0 (immediate revocation). Maximum is 86400 (24 hours).
          example: 300
      additionalProperties: false
    RefreshApiKeyResponse:
      type: object
      required:
        - id
        - name
        - key_type
        - status
        - redacted_key
        - created_at
        - created_by_user_id
        - key
      description: |
        The refreshed API key credential and its metadata. Refresh replaces the key secret
        but preserves the key's identity (ID, name, type, bindings). Unlike key creation,
        refresh does **not** return `bot_user` details — refresh never creates a new service
        account and the existing bot user's bindings are unchanged.
      properties:
        id:
          type: string
          description: Unique identifier for the API key.
        name:
          type: string
          description: User-defined name for the API key.
        description:
          type: string
          description: Optional user-defined description for the API key.
        key_type:
          $ref: '#/components/schemas/ApiKeyType'
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        redacted_key:
          type: string
          description: Redacted version of the key suitable for display (e.g., "ak-abc...xyz").
        created_at:
          type: string
          format: date-time
          description: Timestamp when the key was created.
        expires_at:
          type: string
          format: date-time
          description: Optional timestamp when the key will expire.
        created_by_user_id:
          type: string
          description: ID of the user who created the key.
        last_used_at:
          type: string
          format: date-time
          description: Approximate timestamp when the key was last used for authentication. This value is periodically updated and may not reflect the most recent usage.
        key:
          type: string
          description: |
            The full replacement API key value. **Only returned once** during
            refresh. Store it securely — it cannot be retrieved again.
      additionalProperties: false
      x-forward-compatible: true
    ServiceApiKey:
      type: object
      required:
        - id
        - name
        - key_type
        - status
        - redacted_key
        - created_at
        - created_by_user_id
        - bot_user
      properties:
        id:
          type: string
          description: Unique identifier for the API key.
        name:
          type: string
          description: User-defined name for the API key.
        description:
          type: string
          description: Optional user-defined description for the API key.
        key_type:
          type: string
          enum:
            - SERVICE
          description: Discriminator value for service keys.
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        redacted_key:
          type: string
          description: Redacted version of the key suitable for display (e.g., "ak-abc...xyz").
        created_at:
          type: string
          format: date-time
          description: Timestamp when the key was created.
        expires_at:
          type: string
          format: date-time
          description: Optional timestamp when the key will expire.
        created_by_user_id:
          type: string
          description: ID of the user who created the key.
        last_used_at:
          type: string
          format: date-time
          description: Approximate timestamp when the key was last used for authentication. This value is periodically updated and may not reflect the most recent usage.
        bot_user:
          $ref: '#/components/schemas/ServiceKeyBotUser'
          description: |
            The bot user backing this service key, including its resolved role assignments.
            Use `bot_user.id` as the `user_id` when creating a role binding for this key.
      additionalProperties: false
      x-forward-compatible: true
    ServiceKeyBotUser:
      type: object
      required:
        - id
        - name
        - account_role
        - organizations
      properties:
        id:
          type: string
          description: Global ID of the bot user.
        name:
          type: string
          description: Display name of the bot user.
        account_role:
          allOf:
            - $ref: '#/components/schemas/UserRoleAssignment'
          description: |
            Account-level role assigned to the bot user. Always present — defaults are resolved
            server-side. In a list response (`GET /v2/api-keys`) for a bot user that could not be
            resolved, this is a `MEMBER` placeholder and `name` is empty.
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/ServiceKeyBotUserOrgAssignment'
          description: |
            Organization access assignments for the service account, each containing nested
            space assignments. Always empty in a list response (`GET /v2/api-keys`) filtered by
            `space_id`. Also empty in a list response for a bot user whose bindings could not be
            resolved (e.g. a stale or otherwise unrecoverable bot user). `CreatedServiceKeyBotUser` (used in the `POST /v2/api-keys` response)
            tightens this to at least one entry, since creating a service key always requires
            an organization.
      additionalProperties: false
      x-forward-compatible: true
    ServiceKeyBotUserOrgAssignment:
      type: object
      required:
        - org_id
        - role
        - spaces
      properties:
        org_id:
          type: string
          description: ID of the organization the service account has access to.
          example: T3JnYW5pemF0aW9uOjEwMDE6eFl6Vw
        role:
          allOf:
            - $ref: '#/components/schemas/OrganizationRoleAssignment'
          description: Role assigned to the bot user within this organization. Always present — defaults are resolved server-side.
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/ServiceKeyBotUserSpaceAssignment'
          description: Space assignments within this organization. Roles are always present in the response (defaults are resolved server-side).
      additionalProperties: false
      x-forward-compatible: true
    ServiceKeyBotUserSpaceAssignment:
      type: object
      required:
        - space_id
        - role
      properties:
        space_id:
          type: string
          description: ID of the space the service account has access to.
          example: U3BhY2U6MjAwMTphQmNE
        role:
          allOf:
            - $ref: '#/components/schemas/SpaceRoleAssignment'
          description: Role assigned to the bot user within this space. Always present — defaults are resolved server-side.
      additionalProperties: false
      x-forward-compatible: true
    ServiceKeyOrgAssignment:
      type: object
      required:
        - org_id
        - spaces
      properties:
        org_id:
          type: string
          description: ID of the organization to grant the service account access to.
          example: T3JnYW5pemF0aW9uOjEwMDE6eFl6Vw
        role:
          allOf:
            - $ref: '#/components/schemas/OrganizationRoleAssignmentRequest'
          default:
            type: PREDEFINED
            name: READ_ONLY
          description: |
            Role for the bot user within this organization. Only predefined roles are supported at this level.
            Custom org roles (`{ "type": "CUSTOM", "id": "..." }`) are not yet supported and return `422`.
            Support will be added in a future release.
            Defaults to `{ type: PREDEFINED, name: READ_ONLY }` when omitted.
            Must be at or below the caller's own effective organization role.
            The `ANNOTATOR` role is not valid for service keys and returns `422`.
        spaces:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: |
            Spaces within this organization the service account should have access to. Each entry specifies
            a space and optional role. All space IDs must belong to this organization.
          items:
            $ref: '#/components/schemas/ServiceKeySpaceAssignment'
      additionalProperties: false
    ServiceKeySpaceAssignment:
      type: object
      description: |
        Declares one space that the service key's service account should have access to.

        The **space assignment** (`space_id`) identifies the target space. The **role assignment** (`role`)
        specifies the level of access within that space — either a named predefined role or a
        custom RBAC role identified by its ID.
      required:
        - space_id
      properties:
        space_id:
          type: string
          description: ID of the space to grant the service account access to.
          example: U3BhY2U6MjAwMTphQmNE
        role:
          allOf:
            - $ref: '#/components/schemas/SpaceRoleAssignmentRequest'
          default:
            type: PREDEFINED
            name: MEMBER
          description: |
            Role to assign the bot user within this space. A role assignment is either:
            - `{ "type": "PREDEFINED", "name": "ADMIN" | "MEMBER" | "READ_ONLY" }` — a built-in space role
            - `{ "type": "CUSTOM", "id": "<encoded-role-id>" }` — a custom RBAC role

            Defaults to `{ "type": "PREDEFINED", "name": "MEMBER" }` when omitted.
            Must be at or below the caller's own effective space role.
            The `ANNOTATOR` role is not valid for service keys and returns `422`.
      additionalProperties: false
