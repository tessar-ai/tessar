        config:
          $ref: '#/components/schemas/CreateEvaluatorIntegrationConfigInput'
      additionalProperties: false
    CreateGeminiConfig:
      description: Create config for a Google Gemini LLM integration. `api_key` is required and is write-only (never returned in responses).
      type: object
      required:
        - provider
        - api_key
      properties:
        is_function_calling_enabled:
          type: boolean
          description: Enable function/tool calling. Defaults to true.
        provider:
          type: string
          enum:
