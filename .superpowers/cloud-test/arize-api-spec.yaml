        - COMPLETED
        - FAILED
        - CANCELLED
      description: |
        Status of a task run.
        - PENDING - The run has been created but not yet started.
        - RUNNING - The run is currently in progress.
        - COMPLETED - The run finished successfully.
        - FAILED - The run encountered an error and stopped.
        - CANCELLED - The run was cancelled before completion.
    TaskType:
      type: string
      enum:
        - TEMPLATE_EVALUATION
        - CODE_EVALUATION
        - RUN_EXPERIMENT
      description: |
        The task type.
        - TEMPLATE_EVALUATION - An LLM template-based evaluation task.
        - CODE_EVALUATION - A code-based evaluation task.
        - RUN_EXPERIMENT - A task that runs experiments.
    TemplateEvaluationRunConfig:
      x-forward-compatible: true
      type: object
      required:
        - experiment_type
        - ai_integration_id
        - template
        - provide_explanation
      properties:
        experiment_type:
          type: string
          enum:
            - TEMPLATE_EVALUATION
          description: Discriminator. Must be `"TEMPLATE_EVALUATION"`.
        ai_integration_id:
          type: string
          description: AI integration identifier (base64). The LLM that judges each example.
        model_name:
          type: string
          description: Model name (e.g. `gpt-4o`). Falls back to the integration's default if omitted.
        template:
          type: string
          minLength: 1
          description: |
            The evaluation prompt template. Use `{{variable}}` placeholders that map to dataset
            column paths via `column_mapping`.
        provide_explanation:
          type: boolean
          description: Whether to ask the LLM to include a written explanation alongside the score/label.
        classification_choices:
          type: object
          additionalProperties:
            type: number
          description: 'Map of choice label to numeric score (e.g. `{"relevant": 1, "irrelevant": 0}`).'
        column_mapping:
          type: object
          additionalProperties:
            type: string
          description: Maps template variable names to dataset column paths.
        evaluator_version_id:
          type: string
          nullable: true
          description: EvaluatorVersion identifier (base64). Links this run to an Eval Hub evaluator version.
        invocation_parameters:
          $ref: '#/components/schemas/InvocationParams'
        provider_parameters:
          type: object
          description: Provider-specific parameters. Defaults to `{}` (no overrides) if omitted.
      description: Configuration for running a template-based LLM evaluator against each dataset example.
      additionalProperties: true
    TemplateEvaluationRunConfigRequest:
      type: object
      required:
        - experiment_type
        - ai_integration_id
        - template
        - provide_explanation
      properties:
        experiment_type:
          type: string
          enum:
            - TEMPLATE_EVALUATION
          description: Discriminator. Must be `"TEMPLATE_EVALUATION"`.
        ai_integration_id:
          type: string
          description: AI integration identifier (base64). The LLM that judges each example.
        model_name:
          type: string
          description: Model name (e.g. `gpt-4o`). Falls back to the integration's default if omitted.
        template:
          type: string
          minLength: 1
          description: |
            The evaluation prompt template. Use `{{variable}}` placeholders that map to dataset
            column paths via `column_mapping`.
        provide_explanation:
          type: boolean
          description: Whether to ask the LLM to include a written explanation alongside the score/label.
        classification_choices:
          type: object
          additionalProperties:
            type: number
          description: 'Map of choice label to numeric score (e.g. `{"relevant": 1, "irrelevant": 0}`).'
        column_mapping:
          type: object
          additionalProperties:
            type: string
          description: Maps template variable names to dataset column paths.
        evaluator_version_id:
          type: string
          nullable: true
          description: EvaluatorVersion identifier (base64). Links this run to an Eval Hub evaluator version.
        invocation_parameters:
          $ref: '#/components/schemas/InvocationParamsRequest'
        provider_parameters:
          type: object
          description: Provider-specific parameters. Defaults to `{}` (no overrides) if omitted.
      description: Strict request configuration for running a template-based LLM evaluator.
      additionalProperties: false
    TraceOrSessionEvaluatorInput:
      type: object
      required:
        - evaluator_id
        - query_mappings
      properties:
        evaluator_id:
          type: string
          description: Evaluator identifier (base64). Duplicates are not allowed.
        evaluator_version_id:
          type: string
          nullable: true
          description: |
            Pin this evaluator to a specific version (base64). Defaults to null, which
            always runs the evaluator's latest version; omitting the field and sending
            null are equivalent. Must be a version of the evaluator named by
            `evaluator_id`, otherwise the request returns 422.
        query_mappings:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/TaskQueryMappingInput'
          description: Per-evaluator variable-to-query mappings (trace/session shape).
      additionalProperties: false
      description: Trace/session-granularity evaluator input. Uses `query_mappings`.
    TriggerTaskRunRequest:
      anyOf:
        - $ref: '#/components/schemas/TriggerEvaluationTaskRunRequest'
        - $ref: '#/components/schemas/TriggerRunExperimentTaskRunRequest'
      description: |
        Trigger body for `POST /v2/tasks/{task_id}/trigger`. The server derives the
        task type from the URL's task record and selects the appropriate schema; the
        body itself does not carry a `task_type` field.

        | Task type | Schema |
        |---|---|
        | `TEMPLATE_EVALUATION` | `TriggerEvaluationTaskRunRequest` |
        | `CODE_EVALUATION` | `TriggerEvaluationTaskRunRequest` |
        | `RUN_EXPERIMENT` | `TriggerRunExperimentTaskRunRequest` |

        Sending a field that is not valid for the resolved task type returns 400.
        For `TEMPLATE_EVALUATION` and `CODE_EVALUATION` tasks all trigger fields are
        optional — an empty body is valid and uses server defaults.
    UpdateTaskRequest:
      anyOf:
        - $ref: '#/components/schemas/UpdateEvaluationTaskRequest'
        - $ref: '#/components/schemas/UpdateRunExperimentTaskRequest'
      description: |
        PATCH body for `PATCH /v2/tasks/{task_id}`. The server derives the task type
        from the URL's task record and selects the appropriate schema; the body
        itself does not carry a `type` field.

        | Task type | Schema |
        |---|---|
        | `TEMPLATE_EVALUATION` | `UpdateEvaluationTaskRequest` |
        | `CODE_EVALUATION` | `UpdateEvaluationTaskRequest` |
        | `RUN_EXPERIMENT` | `UpdateRunExperimentTaskRequest` |

        Sending a field that is not valid for the resolved task type returns 400
        (e.g. `evaluators` on a `RUN_EXPERIMENT` task, or `run_configuration` on an
        evaluation task).
    ListTracesRequest:
      type: object
      required:
        - project_id
      additionalProperties: false
      properties:
        project_id:
          type: string
          description: The project ID to list traces for
        start_time:
          type: string
          format: date-time
          description: |
            Return traces whose spans start at or after this timestamp (inclusive).
            ISO 8601 format (e.g., `2024-01-01T00:00:00Z`). Defaults to 1 week ago.
        end_time:
          type: string
          format: date-time
          description: |
            Return traces whose spans start at or before this timestamp (inclusive).
            ISO 8601 format (e.g., `2024-01-02T00:00:00Z`). Defaults to the current time.
        filter:
          type: string
          description: |
            Filter expression to apply to the query. Supports SQL-like syntax for
            filtering spans by attributes (e.g., `status_code = 'ERROR'` or
            `span_kind = 'LLM'`). A trace is returned when **any** of its spans
            matches the filter — the matching span is usually a child, not the root.
            Optional; omit it to apply no filter. If provided, it must not be empty
            or whitespace-only.
    ListTracesResponse:
      type: object
      required:
        - traces
        - pagination
      additionalProperties: false
      x-forward-compatible: true
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/Trace'
          description: |
            A list of root-based trace entries ordered by root span `start_time`
            from newest to oldest. The root trace and span identifiers give entries
            with the same start time a stable order.
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
          description: |
            Pagination metadata for cursor-based navigation. A cursor keeps the
            resolved time window fixed and applies only to root selection. It is
            valid only for the same project, filter, and sort order. A page walk is
            not a snapshot: data that arrives after the first request can affect
            later pages.
    Trace:
      type: object
      required:
        - trace_id
        - root_span_id
        - spans_truncated
        - spans
      additionalProperties: false
      x-forward-compatible: true
      properties:
        trace_id:
          type: string
          description: Unique identifier for the trace.
        root_span_id:
          type: string
          description: |
            Span ID of the root span (the span with no parent) that anchors this
            trace entry. A trace with more than one root span is returned as
            multiple entries sharing the same `trace_id`, distinguished by
            `root_span_id`.
        start_time:
          type: string
          format: date-time
          description: Earliest span start time across the returned spans.
        end_time:
          type: string
          format: date-time
          description: Latest span end time across the returned spans.
        spans_truncated:
          type: boolean
          description: |
            `true` when more than 1,000 spans were fetched for this trace and its
            returned list was capped. Traces share a fetch allowance per page.
            If that allowance is exhausted, a trace can be incomplete even when
            this flag is `false`. Narrowing the time window can reduce this risk.
            To retrieve a trace's spans in full, paginate through `POST /v2/spans`
            filtered to that `trace_id` over a time window that covers the full trace.
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'
          description: |
            Flat list of spans belonging to this trace. Each span has the same shape
            and enrichment as spans returned by `POST /v2/spans`. Reconstruct the
            trace tree client-side using each span's `parent_id`.
      description: |
        A Trace is the collection of spans sharing a `trace_id`, anchored on a root
        span (a span with no parent). It captures a single end-to-end request
        through an LLM application, with lightweight roll-up metadata plus the full
        flat list of its spans.
    CreateUserRequest:
      type: object
      description: User-level developer permissions are determined by the assigned account role.
      required:
        - name
        - email
        - role
        - invite_mode
