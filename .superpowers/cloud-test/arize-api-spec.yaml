        **Valid examples**
        ```json
        { "resource_id": "TW9kZWw6MTIxOmFCY0Q=" }
        ```
        ```json
        { "resource_id": "RGFzaGJvYXJkOjQ1NjphQmNE" }
        ```

        **Invalid example**
        ```json
