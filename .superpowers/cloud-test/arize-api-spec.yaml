        - integration_id
      properties:
        integration_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The unique identifier of the integration.
      additionalProperties: false
      x-forward-compatible: true
    DefaultLLMIntegration:
      type: object
      nullable: true
