        - invocation_parameters
        - provider_parameters
      properties:
        ai_integration_id:
          type: string
          description: AI integration identifier (base64)
        model_name:
          type: string
          description: Model name (e.g. gpt-4o)
        invocation_parameters:
          $ref: '#/components/schemas/InvocationParams'
        provider_parameters:
          $ref: '#/components/schemas/ProviderParams'
      additionalProperties: false
      x-forward-compatible: true
    EvaluatorLlmConfigRequest:
      type: object
      description: LLM configuration for an evaluator in a write request (strict form of EvaluatorLlmConfig)
      required:
        - ai_integration_id
        - model_name
        - invocation_parameters
        - provider_parameters
      properties:
        ai_integration_id:
          type: string
          description: AI integration identifier (base64)
        model_name:
          type: string
          description: Model name (e.g. gpt-4o)
        invocation_parameters:
          $ref: '#/components/schemas/InvocationParamsRequest'
        provider_parameters:
          $ref: '#/components/schemas/ProviderParamsRequest'
      additionalProperties: false
    EvaluatorTemplate:
      type: object
      description: |
        A built-in LLM-as-a-judge evaluator template. Templates are the same
        catalog offered in the product's create-evaluator flow, and are identical
        for every caller. They carry no space, account, or user data.

        A template is a starting point for an evaluator. To create one from it, map
        its fields onto `POST /v2/evaluators`. See the field-by-field mapping and a
        complete example on `GET /v2/evaluator-templates`.
      required:
        - column_name
        - display_name
        - template
        - rails
        - classification_choices
        - direction
        - data_granularity
      properties:
        column_name:
          type: string
          description: |
            Stable identifier for the template, and the eval column name it writes
            to by default (e.g. `hallucination`). Unique across all templates.
          example: hallucination
        display_name:
          type: string
          description: Human-readable name shown in the product.
          example: Hallucination
        template:
          type: string
          description: |
            The judge prompt. Variables are single-brace, f-string style (e.g.
            `{input}`, `{output}`, `{context}`) and are bound to real data by a
            task's column mappings when the evaluator runs.

            This is the only prompt you need. To have the judge explain its label,
            set `include_explanations` on `POST /v2/evaluators`. The explanation
            request is added at run time, not by editing this prompt.
          example: |-
            You are evaluating whether the answer is factual...
            {input}
            {output}
        rails:
          type: array
          items:
            type: string
          description: |
            The labels the judge is allowed to return, in the order the product
            displays them.
          example:
            - hallucinated
            - factual
        classification_choices:
