    CreateTaskRequestBody:
      description: |
        Body containing task creation parameters. The `type` field is the discriminator.

        | `type` | Schema |
        |---|---|
        | `TEMPLATE_EVALUATION` | `CreateTemplateEvaluationTaskRequest` |
        | `CODE_EVALUATION` | `CreateCodeEvaluationTaskRequest` |
        | `RUN_EXPERIMENT` | `CreateRunExperimentTaskRequest` |

        `RUN_EXPERIMENT` tasks do not run continuously — they must be triggered
        explicitly via `POST /v2/tasks/{task_id}/trigger` each time.

        For `TEMPLATE_EVALUATION` / `CODE_EVALUATION` tasks, exactly one of `project_id`
        or `dataset_id` must be provided. When `dataset_id` is provided, `experiment_ids`
        must contain at least one entry. `is_continuous` and `sampling_rate` are only
        supported for project-based tasks.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTaskRequest'
          examples:
            TEMPLATE_EVALUATION:
              summary: Template evaluation task (project-based, continuous)
              value:
                name: Production Hallucination Check
                type: TEMPLATE_EVALUATION
                project_id: TW9kZWw6MTIzOmFCY0Q=
                sampling_rate: 1
                is_continuous: true
                query_filter: metadata.environment = 'production'
                evaluators:
                  - evaluator_id: RXZhbHVhdG9yOjEyOmFCY0Q=
                    column_mappings:
                      input: attributes.input.value
                      output: attributes.output.value
            CODE_EVALUATION:
              summary: Code evaluation task (dataset-based)
              value:
                name: My Code Evaluator Task
                type: CODE_EVALUATION
                dataset_id: RGF0YXNldDo1NjpxUndY
                experiment_ids:
                  - RXhwZXJpbWVudDo3OmFCY0Q=
                evaluators:
                  - evaluator_id: RXZhbHVhdG9yOjEyOmFCY0Q=
            pinned_evaluator_version:
              summary: Template evaluation task pinned to an evaluator version
              value:
                name: Hallucination Check v3
                type: TEMPLATE_EVALUATION
                project_id: TW9kZWw6MTIzOmFCY0Q=
                evaluators:
                  - evaluator_id: RXZhbHVhdG9yOjEyOmFCY0Q=
                    evaluator_version_id: RXZhbHVhdG9yVmVyc2lvbjo5OTphQmNE
                    column_mappings:
                      input: attributes.input.value
            run_experiment_llm_generation:
              summary: Run experiment task (LLM generation)
              value:
                name: GPT-4o Baseline Experiment
                type: RUN_EXPERIMENT
                dataset_id: RGF0YXNldDo1NjpxUndY
                run_configuration:
                  experiment_type: LLM_GENERATION
                  ai_integration_id: TGxtSW50ZWdyYXRpb246MTI6YUJjRA==
                  model_name: gpt-4o
                  input_variable_format: F_STRING
                  messages:
                    - role: SYSTEM
                      content: You are a helpful assistant.
                    - role: USER
                      content: 'Answer: {question}'
                  invocation_parameters:
                    temperature: 0.7
            run_experiment_agent_call:
              summary: Run experiment task (agent call)
              value:
                name: Support Agent Experiment
                type: RUN_EXPERIMENT
                dataset_id: RGF0YXNldDo1NjpxUndY
                run_configuration:
                  experiment_type: AGENT_CALL
                  integration_id: UmVtb3RlRW5kcG9pbnRJbnRlZ3JhdGlvbjoxOmFCY0Q=
                  input_template:
                    query: '{{question}}'
                    context: '{{dataset.context}}'
    TriggerTaskRunRequestBody:
      description: |
        Trigger body for `POST /v2/tasks/{task_id}/trigger`. The server derives
        the task type from the URL's task record and selects the appropriate
        schema; the body itself does not carry a `task_type` field.

        | Task type | Schema |
        |---|---|
        | `TEMPLATE_EVALUATION` | `TriggerEvaluationTaskRunRequest` |
        | `CODE_EVALUATION` | `TriggerEvaluationTaskRunRequest` |
        | `RUN_EXPERIMENT` | `TriggerRunExperimentTaskRunRequest` |

        Sending a field that is not valid for the resolved task type returns 400.
        For `TEMPLATE_EVALUATION` and `CODE_EVALUATION` tasks all trigger fields
        are optional — an empty body is valid and uses server defaults.
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TriggerTaskRunRequest'
          examples:
            evaluation:
              summary: Trigger a template/code evaluation run
              value:
                data_start_time: '2026-03-01T00:00:00Z'
                data_end_time: '2026-03-07T00:00:00Z'
                max_spans: 5000
                override_evaluations: false
            RUN_EXPERIMENT:
              summary: Trigger a RUN_EXPERIMENT run
              value:
                experiment_name: GPT-4o Baseline v2
                max_examples: 50
                tracing_metadata:
                  source: api
    UpdateTaskRequestBody:
      description: |
        PATCH body for `PATCH /v2/tasks/{task_id}`. The server derives the task
        type from the URL's task record and selects the appropriate schema; the
        body itself does not carry a `type` field.

        | Task type | Schema |
        |---|---|
        | `TEMPLATE_EVALUATION` | `UpdateEvaluationTaskRequest` |
        | `CODE_EVALUATION` | `UpdateEvaluationTaskRequest` |
        | `RUN_EXPERIMENT` | `UpdateRunExperimentTaskRequest` |

        For `TEMPLATE_EVALUATION` and `CODE_EVALUATION` tasks, at least one of
        `name`, `sampling_rate`, `is_continuous`, `query_filter`, or `evaluators`
        must be provided.

        For `RUN_EXPERIMENT` tasks, at least one of `name` or `run_configuration`
        must be provided. When `run_configuration` is provided the stored config
        is atomically replaced.

        Sending a field that is not valid for the resolved task type returns 400
        (e.g. `evaluators` on a `RUN_EXPERIMENT` task, or `run_configuration` on
        an evaluation task).
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateTaskRequest'
          examples:
            evaluation:
              summary: Update a template/code evaluation task
              value:
                name: Updated Task Name
                sampling_rate: 0.5
                query_filter: metadata.environment = 'staging'
            pin_evaluator_version:
              summary: Pin one evaluator to a version, leave the other on latest
              value:
                evaluators:
                  - evaluator_id: RXZhbHVhdG9yOjEyOmFCY0Q=
                    evaluator_version_id: RXZhbHVhdG9yVmVyc2lvbjo5OTphQmNE
                  - evaluator_id: RXZhbHVhdG9yOjEzOmFCY0Q=
            run_experiment_name:
              summary: Rename a RUN_EXPERIMENT task
              value:
                name: My Renamed Experiment Task
            run_experiment_config:
              summary: Update RUN_EXPERIMENT task configuration
              value:
                run_configuration:
                  experiment_type: LLM_GENERATION
                  ai_integration_id: TGxtSW50ZWdyYXRpb246MTI6YUJjRA==
                  model_name: gpt-4o-mini
                  input_variable_format: F_STRING
                  messages:
                    - role: USER
                      content: 'Answer: {question}'
    ListTracesRequestBody:
      description: Body containing trace query parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListTracesRequest'
          example:
            project_id: my-project
