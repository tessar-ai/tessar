        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem
        entitlement:
          type: string
          description: Set when the plan doesn't include the capability or the account has reached its plan's limit on a count; the uppercase key, such as `DASHBOARD_CUSTOMIZATION` or `SPACES`.
