    UpdateAgentConfig:
      type: object
      description: |
        Partial agent config for PATCH. All collection fields are
        replace-on-provide.
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: New HTTPS endpoint URL. Validated server-side and must resolve to a public address.
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            Replace-on-provide. Pass `null` (or `{}`) to clear all headers.
            Encrypted at rest; never returned in responses.
        input_schema:
          type: object
          additionalProperties: true
          description: New JSON Schema for the request payload shape.
        request_presets:
          type: array
          items:
            $ref: '#/components/schemas/UpdateAgentRequestPresetInput'
          description: |
            Replace-on-provide preset list, matched by `name`: existing names
            update in place (preserving id/timestamps), new names insert,
            removed names delete.
      additionalProperties: false
    UpdateAgentIntegrationRequest:
      type: object
      description: |
        Partial update body for `type=AGENT`. `type` is immutable; if present
        it must equal `AGENT` (422 otherwise).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - AGENT
          description: Discriminator. Immutable; must match the integration's type.
        name:
          type: string
          description: New integration name. Must be unique among active AGENT and EVALUATOR integrations in the account.
        description:
          type: string
          nullable: true
          description: New human-readable description of the integration. Pass null to clear it.
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationScopingRequest'
          description: Replace-on-provide. Empty array reverts to account-wide.
        config:
          $ref: '#/components/schemas/UpdateAgentConfig'
      additionalProperties: false
    UpdateAgentRequestPresetInput:
      type: object
      description: |
        Write shape for an agent request preset on update. Matched by `name`:
        existing names update in place (preserving id/timestamps), new names insert,
        removed names delete. Server-generated fields (`id`, `created_at`,
        `updated_at`) are not accepted on input.
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Preset name (unique within the integration). Length 1-255.
        description:
          type: string
          maxLength: 1024
          nullable: true
          description: Optional preset description (length 0-1024).
        config:
          type: object
          additionalProperties: true
          description: |
            Partial request body. Validated against the parent integration's
            `input_schema` with `required` dropped.
      additionalProperties: false
    UpdateEvaluatorIntegrationConfigInput:
      type: object
      description: |
        Partial evaluator config for PATCH. Omitted fields are left unchanged.
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: New HTTPS endpoint URL.
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: |
            Replace-on-provide. Pass `null` (or `{}`) to clear all headers.
            Encrypted at rest; never returned in responses.
        input_schema:
          type: object
          additionalProperties: true
          description: |
            New JSON Schema for the request payload shape. The root schema must
            have `type: object`, must not define the reserved top-level
            `arize_metadata` field, and must not exceed 64 KiB.
      additionalProperties: false
    UpdateEvaluatorIntegrationRequest:
      type: object
      description: |
        Partial update body for `type=EVALUATOR`. `type` is immutable; if present
        it must equal `EVALUATOR` (422 otherwise).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - EVALUATOR
          description: Discriminator. Immutable; must match the integration's type.
        name:
          type: string
          description: New integration name. Must be unique among active AGENT and EVALUATOR integrations in the account.
        description:
          type: string
          nullable: true
          description: New human-readable description of the integration. Pass null to clear it.
        scopings:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationScopingRequest'
          description: Replace-on-provide. Empty array reverts to account-wide.
        config:
          $ref: '#/components/schemas/UpdateEvaluatorIntegrationConfigInput'
      additionalProperties: false
    UpdateIntegrationRequest:
      description: Partial update of an integration, discriminated by `type` (immutable). The `type` field selects the per-type PATCH shape. Provide at least one updatable field in addition to `type`.
      discriminator:
        propertyName: type
        mapping:
          LLM: '#/components/schemas/UpdateLlmIntegrationRequest'
          AGENT: '#/components/schemas/UpdateAgentIntegrationRequest'
          EVALUATOR: '#/components/schemas/UpdateEvaluatorIntegrationRequest'
      oneOf:
        - $ref: '#/components/schemas/UpdateLlmIntegrationRequest'
        - $ref: '#/components/schemas/UpdateAgentIntegrationRequest'
        - $ref: '#/components/schemas/UpdateEvaluatorIntegrationRequest'
    UpdateLlmAuth:
      description: 'Replacement auth settings for the providers that model credentials as an auth block: `AWS_BEDROCK` and `CUSTOM`. The block must match the stored provider; a Bedrock block on a `CUSTOM` integration (or the reverse) is rejected with 422. There is no discriminator here because `auth_type: DEFAULT` means different things for the two providers — role assumption for Bedrock, API-key auth for a custom endpoint — so the correct variant is determined by the stored provider rather than by `auth_type` alone.'
      oneOf:
        - $ref: '#/components/schemas/CreateAwsBedrockAuth'
        - $ref: '#/components/schemas/CreateCustomAuth'
    UpdateLlmConfig:
      type: object
      description: |
        Partial LLM config for PATCH. `provider` is immutable; if present it must
        match the stored value. Invalid provider/field combinations return 422.

        Provider-specific fields:
        - `api_key`, `is_function_calling_enabled`: all except `AWS_BEDROCK`, `VERTEX_AI`
        - `auth`: `AWS_BEDROCK`, `CUSTOM`
        - `base_url`: `ANTHROPIC`, `CUSTOM`, `LITELLM`, `NVIDIA_NIM`
        - `headers`: `CUSTOM`, `LITELLM`, `NVIDIA_NIM`
        - `is_default_models_enabled`: `AWS_BEDROCK`, `CUSTOM`, `FIREWORKS`, `NVIDIA_NIM`, `TOGETHER_AI`
        - `model_names`: `AWS_BEDROCK`, `CUSTOM`, `FIREWORKS`, `LITELLM`, `NVIDIA_NIM`, `TOGETHER_AI`
        - `project_id`, `location`, `project_access_label`: `VERTEX_AI` only
      properties:
        provider:
          $ref: '#/components/schemas/LlmIntegrationProvider'
        api_key:
          type: string
          nullable: true
          description: Rotate the API key. Pass null to clear it. Omit to keep unchanged. Not valid for `AWS_BEDROCK` (bearer tokens are rotated via `auth`) or `VERTEX_AI`. For `CUSTOM` it cannot be combined with `auth` in the same request; use one or the other.
        is_function_calling_enabled:
          type: boolean
          description: Enable or disable function/tool calling. Omit to keep unchanged. Not valid for `AWS_BEDROCK` or `VERTEX_AI`.
        auth:
          $ref: '#/components/schemas/UpdateLlmAuth'
        base_url:
          type: string
          nullable: true
          description: (`CUSTOM`, `NVIDIA_NIM`, `LITELLM`, and `ANTHROPIC` only) New endpoint URL. For `NVIDIA_NIM` and `ANTHROPIC` the field is optional on the resource, so null clears it (falling back to the provider default endpoint). For `CUSTOM` and `LITELLM` it is required on the resource — null is rejected with 422. Omit to keep unchanged.
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: '(`CUSTOM`, `NVIDIA_NIM`, and `LITELLM` only) Replaces the configured custom request headers: the provided map becomes the full header set. Pass null to clear all headers. Omit to keep unchanged. Write-only; names are exposed as `header_names` on read. The serialized header map must not exceed 8,175 bytes.'
        is_default_models_enabled:
          type: boolean
          description: (`AWS_BEDROCK`, `CUSTOM`, `FIREWORKS`, `NVIDIA_NIM`, and `TOGETHER_AI` only) Enable or disable Arize's default model catalog. For `AWS_BEDROCK`, `CUSTOM`, and `NVIDIA_NIM` the effective config must keep at least one model source or the request is rejected with 422. Omit to keep unchanged.
        model_names:
          type: array
          items:
            type: string
          description: (`AWS_BEDROCK`, `CUSTOM`, `FIREWORKS`, `NVIDIA_NIM`, `LITELLM`, and `TOGETHER_AI` only) Replaces the custom model list. For `AWS_BEDROCK`, `CUSTOM`, and `NVIDIA_NIM` the effective config must keep at least one model source or the request is rejected with 422; `FIREWORKS`, `LITELLM`, and `TOGETHER_AI` resolve models from the provider, so the list may be emptied. Omit to keep unchanged.
        project_id:
          type: string
          description: (`VERTEX_AI` only) New GCP project ID. Required on the resource, so it may be changed but never cleared; omitted fields keep their stored values (per-scalar deep-merge).
        location:
          type: string
          description: (`VERTEX_AI` only) New GCP region. Required on the resource, so it may be changed but never cleared; omitted fields keep their stored values (per-scalar deep-merge).
        project_access_label:
          type: string
          description: (`VERTEX_AI` only) New project-access label. Required on the resource, so it may be changed but never cleared; omitted fields keep their stored values (per-scalar deep-merge).
      additionalProperties: false
    UpdateLlmIntegrationRequest:
      type: object
      description: PATCH body for an `LLM` integration. `type` is required (it selects the union member) and immutable. Provide at least one updatable field (`name`, `scopings`, or `config`) in addition to `type`. `scopings` replaces on provide.
