openapi: 3.0.3
info:
  title: Arize REST API
  version: 2.0.0
  description: |
    API specification for the backend data server. The API is hosted globally
    at https://api.arize.com/v2 or in your own environment.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - description: Global
    url: https://api.arize.com
  - description: Regional
    url: https://api.{region}.arize.com
    variables:
      region:
        default: eu-west-1a
        enum:
          - eu-west-1a
          - ca-central-1a
  - description: Custom Host
    url: https://{host}
    variables:
      host:
        default: api.arize.com
security:
  - bearerAuth: []
tags:
  - name: AI Integrations
    description: |
      AI integrations configure access to external LLM providers (e.g. OpenAI,
      Azure OpenAI, AWS Bedrock, Vertex AI). Integrations can be scoped to the
      entire account, a specific organization, or a specific space.
  - name: Annotation Configs
    description: |
      Annotation configs allow you to define consistent annotation schemas that
      can be reused across your workspace, ensuring evaluations are structured and
      comparable over time.
  - name: Annotation Queues
    description: |
      Annotation queues help you organize and manage human evaluation workflows.
      Use queues to assign spans or examples to annotators for review and labeling.
  - name: API Keys
    description: |
      API keys are used to authenticate requests to the Arize API. List your keys
      to view metadata; the raw secret is never returned after creation.
  - name: Audit Logs
    description: |
      Audit logs record authenticated user actions within an account, providing a
      chronological trail for security and compliance review. Access requires
      account admin privileges and audit logging to be enabled.
  - name: Datasets
    description: |
      Datasets are structured, version-controlled example collections you use to
      run, evaluate, and track LLM experiments.
  - name: Evaluators
    description: |
      Evaluators are reusable evaluation configurations used to assess the quality
      of LLM outputs. They can be template-based (using LLM judges) or code-based.
  - name: Experiments
    description: |
      Experiments let you systematically test prompt/model changes using datasets,
      tasks, and evaluators.
  - name: Integrations
    description: |
      Integrations configure access to external LLM providers (e.g. OpenAI,
      Azure OpenAI, AWS Bedrock, Vertex AI), notifications services (e.g. PagerDuty, Slack), and
      your own agents. Integrations can be scoped to the entire account, a specific
      organization, or a specific space.
  - name: Monitors
    description: |
      Monitors continuously track a metric over your model or LLM application data
      and alert you when it crosses a threshold. Each monitor watches a single
      metric - data quality, model performance, drift, a custom metric, or a
      tracing metric - and moves between statuses as the metric passes in and out of its 
      healthy range.
  - name: Organizations
    description: |
      Organizations are top-level containers within an Arize AX account for grouping spaces.
  - name: Projects
    description: |
      Projects represent LLM applications being monitored in Arize where you can
      observe traces and spans.
  - name: Prompts
    description: |
      Prompts are reusable, versioned templates for LLM interactions. Use prompts
      to standardize and manage how you interact with LLMs across your application.
  - name: Resource Restrictions
    description: |
      Endpoints for restricting and unrestricting resources (projects, models).
  - name: Role Bindings
    description: |
      Role bindings assign a role to a user on a resource. REST currently
      supports space- and project-scoped bindings.
  - name: Roles
    description: |
      Roles define sets of permissions that can be assigned to users within an
      account. Create custom roles to tailor access control to your team's needs.
  - name: Spaces
    description: |
      Spaces are containers within an organization for grouping related projects,
      datasets, and experiments, enabling collaboration or isolated experimentation
      with role-based access control.
  - name: Spans
    description: |
      Spans represent individual operations within a trace. A span captures the
      timing, status, and attributes of a single operation in your application.
  - name: Tags
    description: |
      Tags are reusable labels defined once per space and attached to resources
      across the platform, so the same vocabulary can be applied to projects,
      datasets, prompts, and more. Tags are shared: renaming or deleting a tag
      affects every resource it is attached to.
  - name: Tasks
    description: |
      Tasks are configurable units of work that tie one or more evaluators to a
      data source (project or dataset). Use tasks to automate evaluation of LLM
      outputs, with support for continuous evaluation and backfill runs.
  - name: Traces
    description: |
      A trace is the collection of spans sharing a trace ID, representing a
      single end-to-end request through an LLM application. Use the Traces
      endpoint to retrieve traces with all of their spans in one call.
  - name: Users
    description: |
      Users represent members of an account. The Users endpoints allow creating,
      listing, updating (display name), and removing users from the account programmatically.
  - name: Webhooks
    description: |
      Webhooks are organization-owned destinations that receive event deliveries
      over HTTPS. Deliveries are authenticated with a bearer token or signed with
      an HMAC signing secret — the secret is returned exactly once, when the
      webhook is created. Delivery attempts are recorded and can be listed for
      debugging. To choose which events a webhook receives, manage its
      subscriptions through the prompt and evaluator webhook-subscription
      endpoints.
paths:
  /v2/ai-integrations:
    get:
      x-release-status: alpha
      tags:
        - AI Integrations
      operationId: list_ai_integrations
      summary: List AI integrations
      description: |
        List AI integrations the user has access to.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/SpaceIdQueryParam'
        - $ref: '#/components/parameters/SpaceNameQueryParam'
        - $ref: '#/components/parameters/NameSearchQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/ListAiIntegrationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    post:
      x-release-status: alpha
      tags:
        - AI Integrations
      operationId: create_ai_integration
      summary: Create an AI integration
      description: |
        Create a new AI integration for an external LLM provider.

        **Payload Requirements**
        - `name` and `provider` are required.
        - The integration name must be unique within the account.
        - `provider` must be one of: `OPEN_AI`, `AZURE_OPEN_AI`, `AWS_BEDROCK`, `VERTEX_AI`, `ANTHROPIC`, `NVIDIA_NIM`, `GEMINI`, `CUSTOM`, `LITELLM`, `FIREWORKS`, `TOGETHER_AI`.
        - If `scopings` is omitted, the integration defaults to account-wide visibility.
        - `enable_default_models` defaults to `false` if not provided.
        - `function_calling_enabled` defaults to `true` if not provided.
        - `auth_type` defaults to `DEFAULT` if not provided.
        - For `AWS_BEDROCK` provider, `provider_metadata` must include `role_arn`.
        - For `VERTEX_AI` provider, `provider_metadata` must include `project_id`, `location`, and `project_access_label`.

        **Valid example**
        ```json
        {
          "name": "Production OpenAI",
          "provider": "OPEN_AI",
          "api_key": "sk-abc123...",
          "model_names": ["gpt-4", "gpt-4o"],
          "enable_default_models": true
        }
        ```

        **Invalid example** (missing required `provider`)
        ```json
        {
          "name": "My Integration"
        }
        ```

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      requestBody:
        $ref: '#/components/requestBodies/CreateAiIntegrationRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/AiIntegration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/ai-integrations/{integration_id}:
    get:
      x-release-status: alpha
      tags:
        - AI Integrations
      operationId: get_ai_integration
      summary: Get an AI integration
      description: |
        Get a specific AI integration by its ID.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/AiIntegrationIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/AiIntegration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    patch:
      x-release-status: alpha
      tags:
        - AI Integrations
      operationId: update_ai_integration
      summary: Update an AI integration
      description: |
        Update an AI integration's configuration. At least one field must be provided.
        Omitted fields are left unchanged.

        **Payload Requirements**
        - At least one of the updatable fields must be provided.
        - `name`, if provided, must be unique within the account.
        - `api_key` can be set to `null` to remove the existing key, or omitted to keep it unchanged.
        - `scopings`, if provided, replaces all existing scoping rules.
        - `provider_metadata`, if provided, replaces existing metadata. Set to `null` to remove.

        **Valid example**
        ```json
        {
          "name": "Updated Integration",
          "model_names": ["gpt-4o", "gpt-4o-mini"]
        }
        ```

        **Invalid example** (empty body)
        ```json
        {}
        ```

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/AiIntegrationIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/UpdateAiIntegrationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AiIntegration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    delete:
      x-release-status: alpha
      tags:
        - AI Integrations
      operationId: delete_ai_integration
      summary: Delete an AI integration
      description: |
        Delete an AI integration by its ID. This operation is irreversible.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/AiIntegrationIdPathParam'
      responses:
        '204':
          $ref: '#/components/responses/DeleteAiIntegrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/annotation-configs:
    get:
      x-release-status: stable
      tags:
        - Annotation Configs
      operationId: list_annotation_configs
      x-optic-no-examples: true
      summary: List annotation configs
      description: |
        List annotation configs the user has access to.
      parameters:
        - $ref: '#/components/parameters/SpaceIdQueryParam'
        - $ref: '#/components/parameters/SpaceNameQueryParam'
        - $ref: '#/components/parameters/NameSearchQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/ListAnnotationConfigsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    post:
      x-release-status: stable
      tags:
        - Annotation Configs
      operationId: create_annotation_config
      x-optic-no-examples: true
      summary: Create an annotation config
      description: |
        Create a new annotation config.

        **Payload Requirements**
        - The annotation config name must be unique within the given space.

        **Valid example**
        ```json
        {
          "name": "my-annotation-config",
          "space_id": "spc_123",
          "annotation_config_type": "CATEGORICAL",
          "values": [
            {
              "label": "value1",
              "score": 0
            },
            {
              "label": "value2",
              "score": 1
            }
          ],
          "optimization_direction": "MAXIMIZE"
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/CreateAnnotationConfigRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/AnnotationConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/annotation-configs/{annotation_config_id}:
    get:
      x-release-status: stable
      tags:
        - Annotation Configs
      operationId: get_annotation_config
      x-optic-no-examples: true
      summary: Get an annotation config
      description: |
        Get an annotation config object by its ID.
      parameters:
        - $ref: '#/components/parameters/AnnotationConfigIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/AnnotationConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    patch:
      x-release-status: stable
      tags:
        - Annotation Configs
      operationId: update_annotation_config
      summary: Update an annotation config
      description: |
        Update an annotation config by its ID.

        **Payload Requirements**
        - `annotation_config_type` is required and must match the stored config's type. The
          type is immutable and cannot be changed.
        - The updatable fields depend on the type:
          - `CATEGORICAL`: `name`, `values`, `optimization_direction`.
          - `CONTINUOUS`: `name`, `minimum_score`, `maximum_score`, `optimization_direction`.
          - `FREEFORM`: `name`.
        - All fields other than `annotation_config_type` are optional; omitted fields are left
          unchanged.
        - `name`, if provided, must be unique within the space (409 Conflict if duplicate).
        - `values` replaces the full label set (2-500 labels).
        - System-managed fields (`id`, `space_id`, `created_at`) cannot be modified.

        **Valid example** (categorical config)
        ```json
        {
          "annotation_config_type": "CATEGORICAL",
          "name": "quality-v2",
          "values": [
            { "label": "good", "score": 1 },
            { "label": "bad", "score": 0 }
          ],
          "optimization_direction": "MAXIMIZE"
        }
        ```

        **Invalid example** (missing `annotation_config_type`)
        ```json
        {
          "name": "quality-v2"
        }
        ```
      parameters:
        - $ref: '#/components/parameters/AnnotationConfigIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/UpdateAnnotationConfigRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AnnotationConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    delete:
      x-release-status: stable
      tags:
        - Annotation Configs
      operationId: delete_annotation_config
      summary: Delete an annotation config
      description: |
        Delete an annotation config by its ID. The annotation config must not be associated
        with an active annotation queue; remove it from those queues before deleting it.
        This operation is irreversible.
      parameters:
        - $ref: '#/components/parameters/AnnotationConfigIdPathParam'
      responses:
        '204':
          $ref: '#/components/responses/DeleteAnnotationConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/annotation-configs/{annotation_config_id}/tags:
    get:
      x-release-status: alpha
      tags:
        - Annotation Configs
      operationId: list_annotation_config_tags
      summary: List tags on an annotation config
      description: |
        List the tags attached to an annotation config.

        Tags are shared within the space, so the same tag may appear on many
        resources. An annotation config with no tags returns an empty list rather than a
        404.

        Requires read access to the annotation config. A caller who cannot read it receives
        `404`, identical to the response for an annotation config that does not exist.

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/AnnotationConfigIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/ListTagsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    post:
      x-release-status: alpha
      tags:
        - Annotation Configs
      operationId: add_annotation_config_tags
      summary: Attach tags to a annotation config
      description: |
        Attach one or more existing tags to a annotation config.

        **Payload Requirements**
        - `tag_ids` is required and must contain between 1 and 100 tag IDs.
        - Every tag must already exist and belong to the same space as the
          annotation config. A tag from another space returns `422`.
        - Attaching a tag that is already attached is idempotent, so the same
          request can be retried safely.
        - Unrecognized fields are rejected with `422` rather than ignored.

        Returns `200` with the annotation config's complete tag list, not `201`: attaching
        an existing tag creates no new resource.

        **Valid example**
        ```json
        {
          "tag_ids": ["VGFnOjEyMzQ1", "VGFnOjEyMzQ2"]
        }
        ```

        **Invalid example** (empty list)
        ```json
        {
          "tag_ids": []
        }
        ```
        ```json
        {
          "type": "https://arize.com/docs/ax/rest-reference/errors#validation-error",
          "title": "Unprocessable Entity",
          "status": 422,
          "detail": "tag_ids must contain at least 1 tag ID",
          "request_id": "req_01HZY6X8E7"
        }
        ```

        <Warning>This endpoint is in alpha, read more [here](https://arize.com/docs/ax/rest-reference#api-version-stages).</Warning>
      parameters:
        - $ref: '#/components/parameters/AnnotationConfigIdPathParam'
      requestBody:
        $ref: '#/components/requestBodies/AddTagsRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/ListTagsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/annotation-queues:
    get:
      x-release-status: stable
      tags:
        - Annotation Queues
      operationId: list_annotation_queues
      x-optic-no-examples: true
      summary: List annotation queues
      description: |
        List annotation queues the user has access to.
      parameters:
        - $ref: '#/components/parameters/SpaceIdQueryParam'
        - $ref: '#/components/parameters/SpaceNameQueryParam'
        - $ref: '#/components/parameters/NameSearchQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/ListAnnotationQueuesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    post:
      x-release-status: stable
      tags:
        - Annotation Queues
      operationId: create_annotation_queue
      x-optic-no-examples: true
      summary: Create an annotation queue
      description: |
        Create a new annotation queue.

        **Payload Requirements**
        - The annotation queue name must be unique within the given space (among active queues).
        - At least one `annotation_config_id` is required, and all configs must belong to the specified space.
        - Do not include system-managed fields on input: `id`, `created_at`, `updated_at`.
        - If `assignment_method` is not provided, it defaults to `"all"`.

        **Valid example**
        ```json
        {
          "name": "Quality Review Queue",
          "space_id": "spc_xyz789",
          "annotation_config_ids": ["ac_abc123"],
          "annotator_emails": ["reviewer@example.com"],
          "assignment_method": "all"
        }
        ```

        **Valid example with records**
        ```json
        {
          "name": "Quality Review Queue",
          "space_id": "spc_xyz789",
          "annotation_config_ids": ["ac_abc123"],
          "annotator_emails": ["reviewer@example.com"],
          "record_sources": [
            {"record_type": "SPAN", "project_id": "prj_abc", "start_time": "2024-01-15T00:00:00Z", "end_time": "2024-01-16T00:00:00Z", "span_ids": ["span_001"]},
            {"record_type": "EXAMPLE", "dataset_id": "ds_xyz", "example_ids": ["ex_001", "ex_002"]}
          ]
        }
        ```

        **Invalid example** (missing required annotation_config_ids)
        ```json
        {
          "name": "My Queue",
          "space_id": "spc_xyz789"
        }
        ```
      requestBody:
        $ref: '#/components/requestBodies/CreateAnnotationQueueRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/AnnotationQueue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v2/annotation-queues/{annotation_queue_id}:
    get:
      x-release-status: stable
      tags:
        - Annotation Queues
      operationId: get_annotation_queue
      x-optic-no-examples: true
      summary: Get an annotation queue
      description: |
        Get an annotation queue object by its ID.

        This includes the annotation queue's annotation configs, which define the
        structure of annotations that can be created in this queue.

        This endpoint does not include queue records or annotation progress. To
        manage records in a queue, use the Annotation Queue Items endpoints.
      parameters:
        - $ref: '#/components/parameters/AnnotationQueueIdPathParam'
      responses:
        '200':
          $ref: '#/components/responses/AnnotationQueue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
