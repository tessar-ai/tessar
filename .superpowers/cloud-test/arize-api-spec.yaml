          $ref: '#/components/schemas/SpaceRoleAssignment'
      additionalProperties: false
      x-forward-compatible: true
    UpdateSpaceRequest:
      type: object
      description: |
        Fields to update on a space. Omitted fields keep their current value, `null`
        clears a clearable field, and an object value replaces the existing setting.
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 255
          description: Updated name of the space
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Updated description of the space. Set to `null` to clear it. An empty string is rejected.
        is_private:
          type: boolean
          description: |
            Updated visibility for the space. Set to `true` to make the space
            private (visible only to members and admins), or `false` to make it
            public. When omitted, the existing visibility is preserved.
        default_llm_integration:
          $ref: '#/components/schemas/DefaultLLMIntegration'
          description: |
            The default language model integration and model for the space. Set to
            `null` to clear the default. When omitted, the existing value is preserved.
        ml_models_enabled:
          type: boolean
          description: Whether machine learning models are enabled for the space.
        gradient_start_color:
          type: string
          description: The starting color of the space's visual gradient.
        gradient_end_color:
          type: string
          description: The ending color of the space's visual gradient.
        default_agent_runtime:
          $ref: '#/components/schemas/DefaultAgentRuntime'
          description: |
            The default agent runtime integration for the space. Set to `null` to
            clear the default. When omitted, the existing value is preserved.
      additionalProperties: false
    DeleteSpansRequest:
      type: object
      required:
        - project_id
        - span_ids
      additionalProperties: false
      properties:
        project_id:
          type: string
          description: The project ID containing the spans to delete
        span_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 5000
          description: List of span IDs to delete (maximum 5000)
        start_time:
          type: string
          format: date-time
          description: |
            Scope the delete to spans starting at or after this timestamp (inclusive).
            ISO 8601 format (e.g., `2024-01-01T00:00:00Z`). Each bound is independent:
            omitting `start_time` defaults to two years ago; omitting `end_time`
            defaults to now. You may provide either or both.
        end_time:
          type: string
          format: date-time
          description: |
            Scope the delete to spans starting before this timestamp (exclusive).
            ISO 8601 format (e.g., `2024-01-02T00:00:00Z`). Each bound is independent:
            omitting `start_time` defaults to two years ago; omitting `end_time`
            defaults to now. You may provide either or both.
    ListSpansRequest:
      type: object
      required:
        - project_id
      additionalProperties: false
      properties:
        project_id:
          type: string
          description: The project ID to list spans for
        start_time:
          type: string
          format: date-time
          description: |
            Filter to spans starting at or after this timestamp (inclusive).
            ISO 8601 format (e.g., `2024-01-01T00:00:00Z`). Defaults to 1 week ago.
        end_time:
          type: string
          format: date-time
          description: |
            Filter to spans starting at or before this timestamp (inclusive).
            ISO 8601 format (e.g., `2024-01-02T00:00:00Z`). Defaults to the current time.
        filter:
          type: string
          description: |
            Filter expression to apply to the query. Supports SQL-like syntax
            for filtering spans by attributes (e.g., `status_code = 'ERROR'`).
            Optional; omit it to apply no filter. If provided, it must not be
            empty or whitespace-only.
        included_columns:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: |
            Columns to include in each span. When set, only these columns (plus
            fixed span fields) are returned. Mutually exclusive with
            `excluded_columns` — providing both returns 422.

            Values must be full dotted column paths
            (e.g., `attributes.llm.model_name`, `eval.hallucination.score`).
            Unknown column names are silently ignored.

            Fixed span fields — name, context (trace_id, span_id), kind, parent_id,
            start_time, end_time, status_code, status_message, latency_ms, and
            events — are always returned regardless of this parameter.
        excluded_columns:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: |
            Columns to exclude from each span. When set, all columns except these
            are returned. Mutually exclusive with `included_columns` — providing
            both returns 422.

            Values must be full dotted column paths
            (e.g., `attributes.embedding.vectors`, `eval.toxicity.score`).
            Unknown column names are silently ignored. Attempts to exclude fixed
            span fields (name, context, kind, parent_id, start_time, end_time,
            status_code, status_message, latency_ms, events) are silently ignored.

            Excluding an `attributes.*` column removes that attribute from the
            returned `attributes` object.
        truncate_string_length:
          type: integer
          minimum: 1
          description: |
            When set, every string value inside each returned span's `attributes` object,
            including strings nested at any depth in objects and arrays, is shortened to
            at most this many characters (Unicode code points). Strings longer than the
            limit are cut and end with a single ellipsis character `…` which counts toward
            the limit; strings at or under the limit are unchanged. Only `attributes` string
            values are affected; span IDs, names, kinds, status, timestamps, annotations,
            evaluations, events and pagination are never truncated. Omitted means no truncation.
            Must be a positive integer; 0 or negative returns 422.
    Span:
      type: object
      required:
        - kind
        - name
        - context
        - start_time
        - end_time
      properties:
        name:
          type: string
          description: Name of the span
        context:
          $ref: '#/components/schemas/SpanContext'
          description: The trace and span identifiers for this span
        kind:
          $ref: '#/components/schemas/SpanKind'
          description: The kind of span (OpenInference span kind).
        parent_id:
          type: string
          description: ID of the parent span
        start_time:
          type: string
          format: date-time
          description: Timestamp when the span started
        end_time:
          type: string
          format: date-time
          description: Timestamp when the span ended
        status_code:
          allOf:
            - $ref: '#/components/schemas/SpanStatusCode'
          description: Status code of the span. When absent, the server treats the value as `UNSET` (equivalent to OK).
        status_message:
          type: string
          description: Status message associated with the span
        attributes:
          type: object
          additionalProperties: true
          description: Key-value pairs of span attributes
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: List of span-level human annotations on this span
        trace_annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          description: List of trace-level human annotations on this span
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
          description: List of evaluation results on this span
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpanEvent'
          description: List of events that occurred during the span
      description: |
        A Span represents a single unit of work within a distributed trace for an LLM application.
        It captures the operation’s input and output, start and end times, and a span kind indicating its role (such as LLM, Tool, Agent, Retriever, Chain, or Embedding).
        Spans are hierarchically related and combine to form a trace, enabling end-to-end visibility into request execution, performance bottlenecks, and errors across complex LLM pipelines.
      additionalProperties: false
      x-forward-compatible: true
    SpanContext:
      type: object
      required:
        - trace_id
        - span_id
      properties:
        trace_id:
          type: string
          description: Unique identifier for the trace this span belongs to
        span_id:
          type: string
          description: Unique identifier for the span
      additionalProperties: false
      x-forward-compatible: true
    SpanEvent:
      type: object
      required:
        - name
        - timestamp
      properties:
        name:
          type: string
          description: Name of the event
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the event occurred
        attributes:
          type: object
          additionalProperties: true
          description: Key-value pairs of event attributes
      additionalProperties: false
      x-forward-compatible: true
    SpanStatusCode:
      type: string
      enum:
        - OK
        - ERROR
        - UNSET
      description: |
        Status code of the span.
        - OK - The operation completed successfully.
        - ERROR - The operation failed with an error.
        - UNSET - No status code was set (default, treated as OK).
    AddTagsRequest:
      type: object
      required:
        - tag_ids
      properties:
        tag_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
          description: |
            IDs of the tags to attach. Up to 100 per request. Tags must belong to
            the same space as the resource. Attaching a tag that is already
            attached is idempotent rather than an error, so the same request can be
            retried safely.
      additionalProperties: false
    CreateTagRequest:
      type: object
      required:
        - name
        - space_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Name of the tag. Must be unique within the space, compared
            case-insensitively — a space containing `Production` cannot also contain
            `production`. Maximum 100 characters.
        description:
          type: string
          nullable: true
          description: |
            Description of what the tag is for. Defaults to `null` when omitted.
        color:
          allOf:
            - $ref: '#/components/schemas/TagColor'
          nullable: true
          description: |
            Display color for the tag. Defaults to `null` when omitted, meaning no
            color is assigned.
        space_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: The unique identifier of the space to create the tag in
      additionalProperties: false
    RemoveTagsRequest:
      type: object
      required:
        - tag_ids
      properties:
        tag_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Id'
          description: |
            IDs of the tags to detach. Up to 100 per request. An ID that is not
            currently attached is reported in `not_deleted` rather than causing
            the whole request to fail, so the same request can be retried
            safely.
      additionalProperties: false
    RemoveTagsResponse:
      type: object
      required:
        - completed
        - deleted
        - not_deleted
      properties:
        completed:
          type: boolean
          description: |
            True when every requested tag ID was attached and has been detached.
            False when one or more requested IDs appear in `not_deleted`.
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: IDs of the tags that were attached and have been detached.
        not_deleted:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: |
            IDs from the request that were not attached to the resource. Not an
            error — detaching an already-detached tag is a no-op.
      additionalProperties: false
      x-forward-compatible: true
    ListTagsResponse:
      type: object
      required:
        - tags
        - pagination
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: |
