      example: RXZhbHVhdG9yOjEyMzQ1
    EvaluatorVersionIdPathParam:
      name: version_id
      in: path
      required: true
      description: The unique evaluator version identifier (base64)
      schema:
        $ref: '#/components/schemas/Id'
      example: RXZhbHVhdG9yVmVyc2lvbjoxMjM0NQ==
    EvaluatorVersionIdQueryParam:
      name: version_id
      in: query
      description: Return the evaluator with this specific version (base64 identifier (base64)). If omitted, returns the latest version.
      schema:
        $ref: '#/components/schemas/Id'
      example: RXZhbHVhdG9yVmVyc2lvbjoxMjM0NQ==
    ExperimentIdPathParam:
      name: experiment_id
      in: path
      description: The unique experiment identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: RXhwZXJpbWVudDoxMjM0NQ==
    IntegrationIdPathParam:
      name: integration_id
      in: path
      description: The unique integration identifier.
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: TGxtSW50ZWdyYXRpb246MTI6YUJjRA==
    IntegrationTypeQueryParam:
      name: type
      in: query
      required: false
      description: Filter the list to a single integration type. When omitted, `LLM` and `AGENT` integrations are returned; `EVALUATOR` integrations must be requested explicitly with `type=EVALUATOR`. Each item carries its `type` for client-side discrimination.
      schema:
        $ref: '#/components/schemas/IntegrationType'
    MonitorCustomMetricIdQueryParam:
      name: custom_metric_id
      in: query
      required: false
      description: |
        Filter to `CUSTOM_METRIC` monitors evaluating this custom metric
        (base64 identifier). If omitted, no custom metric filtering is
        applied.
      schema:
        $ref: '#/components/schemas/Id'
      example: Q3VzdG9tTWV0cmljOjEyMzQ1
    MonitorDataQualityMetricQueryParam:
      name: data_quality_metric
      in: query
      required: false
      description: |
        Filter to monitors computing this data quality metric. Matches both
        `DATA_QUALITY` and `TRACING` monitors; combine with `type` to narrow
        to one of them. If omitted, no data quality metric filtering is
        applied.
      schema:
        $ref: '#/components/schemas/DataQualityMetric'
      example: PERCENT_EMPTY
    MonitorDimensionCategoryQueryParam:
      name: dimension_category
      in: query
      required: false
      description: |
        Filter to monitors whose metric is computed over a dimension of this
        category. Values copied from a returned monitor's `dimension.category`
        work as filters. If omitted, no dimension category filtering is
        applied.
      schema:
        $ref: '#/components/schemas/DimensionCategory'
      example: LLM_EVAL
    MonitorDimensionNameQueryParam:
      name: dimension_name
      in: query
      required: false
      description: |
        Exact-match filter on the name of the dimension the monitor's metric
        is computed over. Values copied from a returned monitor's
        `dimension.name` work as filters. If omitted, no dimension name
        filtering is applied.
      schema:
        type: string
        maxLength: 255
      example: eval.Hallucination.label
    MonitorDriftMetricQueryParam:
      name: drift_metric
      in: query
      required: false
      description: |
        Filter to `DRIFT` monitors computing this drift metric. If omitted,
        no drift metric filtering is applied.
      schema:
        $ref: '#/components/schemas/DriftMetric'
      example: PSI
    MonitorIdPathParam:
      name: monitor_id
      in: path
      required: true
      description: The unique monitor identifier (base64)
      schema:
        $ref: '#/components/schemas/Id'
      example: TW9uaXRvcjoxMjM=
    MonitorNotificationsEnabledQueryParam:
      name: notifications_enabled
      in: query
      required: false
      description: |
        Filter by whether notifications fire on a triggered transition.
        `true` returns only monitors with notifications enabled; `false`
        returns only monitors with notifications disabled. If omitted,
        monitors are returned regardless of notification state.
      schema:
        type: boolean
      example: true
    MonitorPerformanceMetricQueryParam:
      name: performance_metric
      in: query
      required: false
      description: |
        Filter to `PERFORMANCE` monitors computing this performance metric.
        Does not match `CUSTOM_METRIC` monitors. If omitted, no performance
        metric filtering is applied.
      schema:
        $ref: '#/components/schemas/PerformanceMetric'
      example: ACCURACY
    MonitorProjectNameQueryParam:
      name: project_name
      in: query
      required: false
      description: |
        Exact-match filter on the name of the project the monitor's primary
        metric is computed over. Unlike `name` and `space_name`, this is an
        exact (case-sensitive) match, not a substring search. If omitted, no
        project name filtering is applied.
      schema:
        type: string
        maxLength: 255
      example: my-llm-app
    MonitorStatusQueryParam:
      name: status
      in: query
      required: false
      description: |
        Filter by the monitor's current evaluation state (`TRIGGERED`,
        `CLEARED`, or `NO_DATA`). If omitted, monitors in every state are
        returned.
      schema:
        $ref: '#/components/schemas/MonitorStatus'
      example: TRIGGERED
    MonitorTypeQueryParam:
      name: type
      in: query
      required: false
      description: |
        Filter by monitor type. Types are exact: `DATA_QUALITY` does not
        include `TRACING` monitors, and `PERFORMANCE` does not include
        `CUSTOM_METRIC` monitors. If omitted, monitors of all types are
        returned.
      schema:
        $ref: '#/components/schemas/MonitorType'
      example: TRACING
    OrganizationIdQueryParam:
      name: org_id
      in: query
      required: false
      description: The unique organization identifier (base64). When provided, only resources belonging to this organization are returned.
      schema:
        $ref: '#/components/schemas/Id'
      example: T3JnYW5pemF0aW9uOjEyMzQ1
    ProjectIdPathParam:
      name: project_id
      in: path
      description: The unique project identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: TW9kZWw6MTIzOmFCY0Q=
    ProjectIdQueryParam:
      name: project_id
      in: query
      required: false
      description: |
        Filter results to resources associated with a specific project (base64 identifier). If omitted, results are not filtered by project.
      schema:
        $ref: '#/components/schemas/Id'
      example: TW9kZWw6MTIzOmFCY0Q=
    ProjectTypeQueryParam:
      name: project_type
      in: query
      required: false
      description: |
        Filter projects by type. When omitted, projects of every type are
        returned. Set to `HARNESS` to return only harness session projects.
      schema:
        $ref: '#/components/schemas/ProjectType'
      example: HARNESS
    LabelNamePathParam:
      name: label_name
      in: path
      description: The name of the label (e.g., "production", "staging")
      required: true
      schema:
        type: string
    LabelQueryParam:
      name: label
      in: query
      description: Return the prompt with the version pointed to by this label (e.g., "production"). Mutually exclusive with `version_id`.
      required: false
      schema:
        type: string
      example: production
    PromptIdPathParam:
      name: prompt_id
      in: path
      description: The unique prompt identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: UHJvbXB0OjEyMzQ1
    PromptVersionIdPathParam:
      name: version_id
      in: path
      description: The unique prompt version identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: UHJvbXB0VmVyc2lvbjoxMjM0NQ==
    ResourceIdPathParam:
      name: resource_id
      in: path
      description: The unique resource identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleBindingIdPathParam:
      name: binding_id
      in: path
      description: The unique role binding identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: Um9sZUJpbmRpbmc6MTphQmNE
    RoleIdPathParam:
      name: role_id
      in: path
      description: The unique role identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: Um9sZToxOmFCY0Q=
    RolesIsPredefinedQueryParam:
      name: is_predefined
      in: query
      required: false
      description: |
        Filter roles by predefined status.
        - `true` - Return only system-defined predefined roles.
        - `false` - Return only custom (account-defined) roles.

        When not specified, returns all roles (both predefined and custom).
      schema:
        type: boolean
    SpaceIdPathParam:
      name: space_id
      in: path
      description: The unique space identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: U3BhY2U6MTIzNDU=
    SpaceIdQueryParam:
      name: space_id
      in: query
      description: Filter search results to a particular space ID
      schema:
        $ref: '#/components/schemas/Id'
      example: U3BhY2U6MTIzNDU=
    SpaceNameQueryParam:
      name: space_name
      in: query
      description: |
        Case-insensitive substring filter on the space name. Narrows results
        to resources in spaces whose name contains the given string. If omitted,
        no space name filtering is applied and all resources are returned.
      schema:
        type: string
        maxLength: 255
      example: my-space
    TagIdPathParam:
      name: tag_id
      in: path
      description: The unique tag identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: VGFnOjEyMzQ1
    TaskIdPathParam:
      name: task_id
      in: path
      required: true
      description: The unique task identifier (base64)
      schema:
        $ref: '#/components/schemas/Id'
      example: VGFzazoxMjM0NQ==
    TaskRunIdPathParam:
      name: run_id
      in: path
      required: true
      description: The unique task run identifier (base64)
      schema:
        $ref: '#/components/schemas/Id'
      example: VGFza1J1bjoxMjM0NQ==
    TaskRunStatusQueryParam:
      name: status
      in: query
      description: 'Filter by run status: PENDING, RUNNING, COMPLETED, FAILED, CANCELLED'
      schema:
        $ref: '#/components/schemas/TaskRunStatus'
      example: COMPLETED
    TaskTypeQueryParam:
      name: type
      in: query
      description: 'Filter by task type: TEMPLATE_EVALUATION, CODE_EVALUATION, or RUN_EXPERIMENT'
      schema:
        $ref: '#/components/schemas/TaskType'
      example: TEMPLATE_EVALUATION
    UserIdPathParam:
      name: user_id
      in: path
      description: The unique user identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: VXNlcjoxMjM0NQ==
    UserIdQueryParam:
      name: user_id
      in: query
      required: false
      description: |
        Filter results by user (base64 global user ID). When provided, only records
        associated with this user are returned. Access requirements vary by endpoint —
        some endpoints restrict this filter to account admins.
      schema:
        $ref: '#/components/schemas/Id'
      example: VXNlcjoxMjM0NQ==
    UserStatusQueryParam:
      name: status
      in: query
      required: false
      description: |
        Filter users by account status. When omitted, `ACTIVE`, `INVITED`, and `EXPIRED` users are returned.
        Can be specified multiple times to filter by multiple statuses (e.g., `?status=ACTIVE&status=INVITED`).
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/UserStatus'
    WebhookIdPathParam:
      name: webhook_id
      in: path
      description: The unique webhook identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: V2ViaG9vazoxMjM0NQ==
    WebhookSourceIdQueryParam:
      name: source_id
      in: query
      required: false
      description: |
        Filter subscriptions to one prompt or evaluator. Must be paired with
        `source_type`. When both filters are omitted, subscriptions from every
        readable supported source are returned.
      schema:
        $ref: '#/components/schemas/Id'
      example: UHJvbXB0OjEyMzQ1
    WebhookSourceTypeQueryParam:
      name: source_type
      in: query
      required: false
      description: |
        Filter subscriptions to one kind of source. Must be paired with
        `source_id`. When both filters are omitted, subscriptions from every
        supported source type are returned.
      schema:
        $ref: '#/components/schemas/WebhookSourceType'
      example: PROMPT
    WebhookSubscriptionIdPathParam:
      name: subscription_id
      in: path
      description: The unique webhook subscription identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: V2ViaG9va1N1YnNjcmlwdGlvbjoxMjM0NQ==
    CursorQueryParam:
      name: cursor
      in: query
      description: |
        Opaque pagination cursor returned from a previous response
        (`pagination.next_cursor`). Treat it as an unreadable token; do not
        attempt to parse or construct it.
      schema:
        type: string
    EmailSearchQueryParam:
      name: email
      in: query
      required: false
      description: |
        Filter users by email address (case-insensitive partial match, up to 255 characters).
        Results are scoped to users visible to the caller.
      schema:
        type: string
        maxLength: 255
      example: jane@example.com
    EndTimeQueryParam:
      name: end_time
      in: query
      required: false
      description: |
        Inclusive upper bound on `created_at` (ISO 8601 datetime).
        Defaults to the current time when omitted.
      schema:
        type: string
        format: date-time
      example: '2026-05-18T23:59:59Z'
    LimitQueryParam:
      name: limit
      in: query
      description: Maximum items to return. Defaults to 50 if omitted; maximum is 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LimitQueryParamLarge:
      name: limit
      in: query
      description: Maximum items to return. Defaults to 50 if omitted; maximum is 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    LimitQueryParamSmall:
      name: limit
      in: query
      description: Maximum items to return. Defaults to 25 if omitted; maximum is 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
    NameSearchQueryParam:
      name: name
      in: query
      description: |
        Case-insensitive substring filter on the resource name. Returns only
        resources whose name contains the given string. For example,
        `name=prod` matches "production", "my-prod-dataset", etc. If omitted,
        no name filtering is applied and all resources are returned.
      schema:
        type: string
        maxLength: 255
      example: production
    StartTimeQueryParam:
      name: start_time
      in: query
      required: false
      description: |
        Inclusive lower bound on `created_at` (ISO 8601 datetime).
        Defaults to 30 days before `end_time` when omitted.
      schema:
        type: string
        format: date-time
      example: '2026-04-18T00:00:00Z'
    VersionIdQueryParam:
      name: version_id
      in: query
      description: Return the prompt with this specific version (base64 identifier (base64)). Mutually exclusive with `label`.
      required: false
      schema:
        $ref: '#/components/schemas/Id'
      example: UHJvbXB0VmVyc2lvbjoxMjM0NQ==
    OrgIdPathParam:
      name: org_id
      in: path
      description: The unique organization identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: T3JnYW5pemF0aW9uOjEyMzQ1
    ResourceRestrictionTypeQueryParam:
      name: resource_type
      in: query
      required: false
      description: |
        Filter restrictions to a single resource type.
        - `PROJECT` — Return only restricted projects.
        - `DASHBOARD` — Return only restricted dashboards.
        - `PROMPT` — Return only restricted prompts.

        When not specified, restrictions of all supported types are returned in one merged list.
      schema:
        $ref: '#/components/schemas/ResourceRestrictionType'
      example: PROJECT
    RoleBindingsUserIdQueryParam:
      name: user_id
      in: query
      required: false
      description: |
        Filter role bindings by user. When provided, only bindings assigned to this
        user are returned. Must be a valid global user ID.

        For a service key, pass its bot user's ID (`bot_user.id` from
        `POST /v2/api-keys` or `GET /v2/api-keys`) to list that key's bindings.
      schema:
        $ref: '#/components/schemas/Id'
      example: VXNlcjoxOmxQZzI=
    RoleBindingsResourceTypeQueryParam:
      name: resource_type
      in: query
      required: true
      description: |
        Filter role bindings by resource type.
        - `SPACE` — Return only space-level bindings.
        - `PROJECT` — Return only project-level bindings.
      schema:
        $ref: '#/components/schemas/RoleBindingResourceType'
  requestBodies:
    CreateAiIntegrationRequestBody:
      description: Body containing AI integration creation parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAiIntegrationRequest'
          example:
            name: Production OpenAI
            provider: OPEN_AI
            api_key: sk-abc123...
            model_names:
              - gpt-4
              - gpt-4o
            enable_default_models: true
            scopings:
              - organization_id: QWNjb3VudE9yZzoxMjM6YWJj
                space_id: null
    UpdateAiIntegrationRequestBody:
      description: Body containing AI integration update parameters. At least one field must be provided.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAiIntegrationRequest'
          example:
            name: Updated OpenAI Integration
            api_key: null
            model_names:
              - gpt-4o
              - gpt-4o-mini
    CreateAnnotationConfigRequestBody:
      description: Body containing annotation config creation parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAnnotationConfigRequest'
          example:
            name: Accuracy
            space_id: space_12345
            annotation_config_type: CATEGORICAL
            values:
              - label: accurate
                score: 1
              - label: inaccurate
                score: 0
            optimization_direction: MAXIMIZE
    AddAnnotationQueueRecordsRequestBody:
      description: Body containing records to add to an annotation queue
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AddAnnotationQueueRecordsRequest'
          example:
            record_sources:
              - record_type: SPAN
                project_id: proj_abc123
                start_time: '2024-01-15T00:00:00Z'
                end_time: '2024-01-15T23:59:59Z'
                span_ids:
                  - span_abc123
                  - span_def456
    AnnotateAnnotationQueueRecordRequestBody:
      description: Body containing annotations to submit for an annotation queue record
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnnotateAnnotationQueueRecordRequest'
          example:
            annotations:
              - name: accuracy
                score: 0.95
    AssignAnnotationQueueRecordRequestBody:
      description: Body containing the user assignment for an annotation queue record
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssignAnnotationQueueRecordRequest'
          example:
            assigned_user_emails:
              - reviewer@example.com
    CreateAnnotationQueueRequestBody:
      description: Body containing annotation queue creation parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAnnotationQueueRequest'
          example:
            name: Quality Review Queue
            space_id: spc_xyz789
            annotation_config_ids:
              - ac_abc123
            annotator_emails:
              - annotator1@example.com
            assignment_method: ALL
    DeleteAnnotationQueueRecordsRequestBody:
      description: Body containing the IDs of annotation queue records to delete
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteAnnotationQueueRecordsRequest'
          example:
            record_ids:
              - aqr_abc123
              - aqr_def456
    UpdateAnnotationQueueRequestBody:
      description: Body containing annotation queue update parameters. At least one field must be provided.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAnnotationQueueRequest'
          example:
            name: Updated Queue Name
            instructions: Review each response for accuracy and helpfulness
            annotation_config_ids:
              - ac_abc123
            annotator_emails:
              - reviewer@example.com
    CreateApiKeyRequestBody:
      description: Body containing API key creation parameters
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApiKeyRequest'
          examples:
            user_key_minimal:
              summary: User key (minimal)
              value:
                key_type: USER
                name: My dev key
            user_key_with_expiry:
              summary: User key with expiry
              value:
                key_type: USER
                name: CI pipeline key
                description: Expires after one year.
                expires_at: '2026-01-01T00:00:00Z'
            service_key_minimal:
              summary: Service key — minimal (single space, all defaults)
              value:
                key_type: SERVICE
                name: CI pipeline key
                organizations:
                  - org_id: T3JnYW5pemF0aW9uOjEwMDE6eFl6Vw
                    spaces:
                      - space_id: U3BhY2U6MjAwMTphQmNE
            service_key_multi_space:
              summary: Service key — multi-space with explicit roles
              value:
                key_type: SERVICE
                name: ML platform key
                description: Uploads eval results and reads traces across two spaces
                account_role:
                  type: PREDEFINED
                  name: MEMBER
                organizations:
                  - org_id: T3JnYW5pemF0aW9uOjEwMDE6eFl6Vw
                    role:
                      type: PREDEFINED
                      name: MEMBER
                    spaces:
                      - space_id: U3BhY2U6MjAwMTphQmNE
                        role:
                          type: PREDEFINED
                          name: ADMIN
                      - space_id: U3BhY2U6MjAwMjphQmNE
                        role:
                          type: CUSTOM
                          id: Um9sZTozMDAxOnFSc1Q
                expires_at: '2027-01-01T00:00:00Z'
    RefreshApiKeyRequestBody:
      description: |
        Optional body for tightening expiry on the new key and/or setting a grace period on the old key.
        Refresh cannot extend a key's lifetime: with an empty body the refreshed key inherits the old key's expiry,
        and an explicit `expires_at` later than the old key's expiry is rejected with 422.
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshApiKeyRequest'
          examples:
            inherit_expiry:
              summary: Inherit the old key's expiry (empty body)
              value: {}
            shorten_expiry:
              summary: Shorten expiry for the refreshed key (must be ≤ the old key's expiry; a later value is rejected with 422)
              value:
                expires_at: '2027-01-01T00:00:00Z'
            with_grace_period:
              summary: Keep old key valid for 5 minutes after refresh
              value:
                grace_period_seconds: 300
    AnnotateDatasetExamplesRequestBody:
