    DeleteSpansError:
      description: |
        Fatal mid-request error. Returned as `503 Service Unavailable` when the
        server encountered an unrecoverable error after partially processing the
        request. The caller should retry the original full request — the delete
        operation is idempotent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DeleteSpansProblem'
          example:
            status: 503
            title: Service Unavailable
            detail: 'Result incomplete: inspect deleted_span_ids, then retry the full request.'
            type: https://arize.com/docs/ax/rest-reference/errors#service-unavailable
            deleted_span_ids:
              - a1b2c3d4e5f6a7b8
            not_deleted_span_ids:
              - b2c3d4e5f6a7b8c9
    DeleteSpansResponse:
      description: |
        Spans deleted. The response body always includes:
        - `completed`: whether all requested spans were fully processed. This endpoint is idempotent — retries are safe.
        - `deleted_span_ids`: IDs of spans confirmed deleted.
        - `not_deleted_span_ids`: IDs of spans not deleted — either not found, or not yet processed when `completed` is `false`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteSpansResponse'
          examples:
            full_success:
              summary: All requested spans deleted
              value:
                completed: true
                deleted_span_ids:
                  - a1b2c3d4e5f6a7b8
                  - b2c3d4e5f6a7b8c9
                not_deleted_span_ids: []
            some_not_found:
              summary: Some spans were not found
              value:
                completed: true
                deleted_span_ids:
                  - a1b2c3d4e5f6a7b8
                not_deleted_span_ids:
                  - c3d4e5f6a7b8c9d0
            incomplete:
              summary: Incomplete — retry required
              value:
                completed: false
                deleted_span_ids:
                  - a1b2c3d4e5f6a7b8
                not_deleted_span_ids:
                  - b2c3d4e5f6a7b8c9
