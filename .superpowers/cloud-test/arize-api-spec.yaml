          description: The unique identifier for the space the evaluator belongs to
        created_at:
          type: string
          format: date-time
          description: When the evaluator was created
        updated_at:
          type: string
          format: date-time
          description: When the evaluator was last updated
        created_by_user_id:
          type: string
          nullable: true
          description: The unique identifier for the user who created the evaluator
      description: |
        An evaluator defines reusable evaluation logic that can be attached to
        evaluation tasks. The type field determines the kind of evaluation:
        TEMPLATE (LLM-based template evaluation), CODE (custom code evaluation),
        or REMOTE (externally hosted evaluation).
      additionalProperties: false
      x-forward-compatible: true
