    MonitorType:
      type: string
      enum:
        - DATA_QUALITY
        - PERFORMANCE
        - DRIFT
        - CUSTOM_METRIC
        - TRACING
      description: |
        The kind of monitor. Determines which type-specific fields apply.
        - `DATA_QUALITY` - Monitors a data quality metric (e.g. percent empty, CARDINALITY).
        - `PERFORMANCE` - Monitors a model performance metric (e.g. ACCURACY, RMSE).
        - `DRIFT` - Monitors distributional drift of a feature/output.
        - `CUSTOM_METRIC` - Monitors a user-defined custom metric.
        - `TRACING` - Monitors a span/trace-derived metric (e.g. span attributes, evals).
    MonitorStatus:
      type: string
      enum:
        - TRIGGERED
        - CLEARED
        - NO_DATA
      description: |
        The monitor's current state from its most recent evaluation.
        - `TRIGGERED` - The metric breached the threshold.
        - `CLEARED` - The metric is within healthy bounds.
        - `NO_DATA` - No data was available to evaluate.
    DimensionCategory:
      type: string
      enum:
        - FEATURE_LABEL
        - TAG
        - MODEL_VERSION
        - BATCH_ID
        - SPAN_ATTRIBUTE
        - LLM_EVAL
        - USER_ANNOTATION
        - ACTUALS
        - ACTUALS_SCORE
        - ACTUALS_CLASS
        - PREDICTIONS
        - PREDICTIONS_SCORE
        - PREDICTIONS_CLASS
      description: |
        The category of dimension the metric is evaluated over.
    DataQualityMetric:
      type: string
      enum:
        - COUNT
        - PERCENT_EMPTY
        - CARDINALITY
        - NEW_VALUES
        - MISSING_VALUES
        - AVG
        - SUM
        - STANDARD_DEVIATION
        - P50
        - P95
        - P99
        - P99_9
        - AVERAGE_STRING_LIST_LENGTH
      description: |
        The data quality metric computed over the selected dimension.
    PerformanceMetric:
      type: string
      enum:
        - ACCURACY
        - CALIBRATION
        - F_1
        - FALSE_NEGATIVE_DENSITY
        - FALSE_NEGATIVE_RATE
        - FALSE_POSITIVE_RATE
        - PRECISION
        - RECALL
        - SENSITIVITY
        - SPECIFICITY
        - MICRO_AVERAGED_PRECISION
        - MACRO_AVERAGED_PRECISION
        - MULTI_CLASS_PRECISION
        - MICRO_AVERAGED_RECALL
        - MACRO_AVERAGED_RECALL
        - MULTI_CLASS_RECALL
        - ACTUALS_AVERAGE
        - MAE
        - MAPE
        - MEAN_ERROR
        - MSE
        - PREDICTION_AVERAGE
        - RMSE
        - R_SQUARED
        - SMAPE
        - WAPE
        - MASE
        - AUC
        - LOG_LOSS
        - NDCG
        - PR_AUC
        - GROUP_AUC
        - MRR
        - RANKING_MAP
        - RANKING_RECALL
        - RANKING_PRECISION
        - DISPARATE_IMPACT
        - FALSE_POSITIVE_RATE_PARITY
        - RECALL_PARITY
      description: |
        The model performance metric.
    DriftMetric:
      type: string
      enum:
        - PSI
        - KL
        - JS
        - KS
        - EUCLIDEAN_DISTANCE
        - COSINE_SIMILARITY
      description: |
        The statistical drift metric. `PSI`/`KL`/`JS`/`KS` apply to structured data;
        `EUCLIDEAN_DISTANCE`/`COSINE_SIMILARITY` apply to unstructured (embedding) data.
    ThresholdOperator:
      type: string
      enum:
        - GREATER_THAN
        - GREATER_THAN_OR_EQUAL
        - LESS_THAN
        - LESS_THAN_OR_EQUAL
        - EQUALS
        - NOT_EQUALS
      description: |
        Numeric comparison operators used when evaluating a computed metric value against a threshold.
    ManualSingleThreshold:
      type: object
      x-forward-compatible: true
      required:
        - type
        - operator
        - value
      properties:
        type:
          type: string
          enum:
            - MANUAL_SINGLE
          description: Identifies this threshold as a single, manually-set value.
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
          description: The comparison applied between the computed metric value and the threshold value.
        value:
          type: number
          description: The threshold value the computed metric is compared against.
    ThresholdCalculation:
      type: string
      enum:
        - STDEV
        - MAD
      description: |
        The statistical calculation used to derive a dynamic threshold.
        - `STDEV` - standard deviation of the metric over the baseline.
        - `MAD` - median absolute deviation of the metric over the baseline.
    DynamicSingleThreshold:
      type: object
      x-forward-compatible: true
      required:
        - type
        - calculation
        - operator
        - multiplier
      properties:
        type:
          type: string
          enum:
            - DYNAMIC_SINGLE
          description: Identifies this threshold as a single value derived from a statistical calculation.
        calculation:
          $ref: '#/components/schemas/ThresholdCalculation'
          description: The statistical calculation used to derive the threshold value.
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
          description: The comparison applied between the computed metric value and the derived threshold.
        multiplier:
          type: number
          description: |
            The multiplier applied to the calculation (e.g. number of standard
            deviations) to derive the threshold.
    ManualThresholdBound:
      type: object
      x-forward-compatible: true
      required:
        - operator
        - value
      properties:
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
          description: The comparison applied between the computed metric value and this bound.
        value:
          type: number
          description: The bound value the computed metric is compared against.
    ManualRangeThreshold:
      type: object
      x-forward-compatible: true
      required:
        - type
        - lower
        - upper
      properties:
        type:
          type: string
          enum:
            - MANUAL_RANGE
          description: Identifies this threshold as a manually-set lower/upper bound range.
        lower:
          allOf:
            - $ref: '#/components/schemas/ManualThresholdBound'
          description: |
            The lower bound of the range. Its operator must be `GREATER_THAN` or `GREATER_THAN_OR_EQUAL`.
        upper:
          allOf:
            - $ref: '#/components/schemas/ManualThresholdBound'
          description: |
            The upper bound of the range. Its `operator` must be `LESS_THAN` or `LESS_THAN_OR_EQUAL`.
    DynamicThresholdBound:
      type: object
      x-forward-compatible: true
      required:
        - operator
        - multiplier
      properties:
        operator:
          $ref: '#/components/schemas/ThresholdOperator'
          description: The comparison applied between the computed metric value and this bound.
        multiplier:
          type: number
          description: |
            The multiplier applied to the calculation (e.g. number of standard deviations) to derive this bound.
    DynamicRangeThreshold:
      type: object
      x-forward-compatible: true
      required:
        - type
        - calculation
        - lower
        - upper
      properties:
        type:
          type: string
          enum:
            - DYNAMIC_RANGE
          description: Identifies this threshold as a lower/upper bound range derived from a statistical calculation.
        calculation:
          $ref: '#/components/schemas/ThresholdCalculation'
          description: The statistical calculation used to derive the lower and upper bounds.
        lower:
          allOf:
            - $ref: '#/components/schemas/DynamicThresholdBound'
          description: |
            The lower bound of the range. Its `operator` must be `GREATER_THAN` or `GREATER_THAN_OR_EQUAL`.
        upper:
          allOf:
            - $ref: '#/components/schemas/DynamicThresholdBound'
          description: |
            The upper bound of the range. Its `operator` must be `LESS_THAN` or `LESS_THAN_OR_EQUAL`.
    ThresholdConfig:
      oneOf:
        - $ref: '#/components/schemas/ManualSingleThreshold'
        - $ref: '#/components/schemas/DynamicSingleThreshold'
        - $ref: '#/components/schemas/ManualRangeThreshold'
        - $ref: '#/components/schemas/DynamicRangeThreshold'
      discriminator:
        propertyName: type
        mapping:
