      description: Custom (user-supplied Python) code evaluator configuration in a write request (strict form of CustomCodeConfig)
      required:
        - type
        - name
        - code
        - variables
      properties:
        data_granularity:
          allOf:
            - $ref: '#/components/schemas/DataGranularity'
          nullable: true
          description: |
            Data granularity level for evaluation. When omitted or null, no granularity
            filter is applied (span-level evaluation is used by default on the server).
        query_filter:
          type: string
          nullable: true
          description: |
            Optional filter query over the chosen data granularity. When omitted or null,
