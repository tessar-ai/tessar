          type: boolean
          description: |
            Whether the task runs continuously. Only supported on project-based tasks.
            Must be `false` or omitted for dataset-based tasks.
        query_filter:
          type: string
          description: |
            Task-level query filter applied to all evaluated data (span shape).
            Mutually exclusive with `query_filters`.
        query_filters:
          allOf:
            - $ref: '#/components/schemas/TaskQueryFiltersInput'
          description: |
            Named query filters plus optional expression for trace/session
            evaluators. Mutually exclusive with `query_filter`.
        evaluators:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaskEvaluatorInput'
          description: |
            Evaluators to attach (at least one required). Evaluators use one of two
            mutually exclusive shapes by data granularity. Span evaluators use
            `query_filter` + per-evaluator `column_mappings`/`query_filter`.
            Trace/session evaluators use task-level `query_filters` plus
            per-evaluator `query_mappings`. Mixing the two shapes returns 400. The
            granularity must match the chosen shape (enforced server-side).
        type:
          type: string
          enum:
            - CODE_EVALUATION
          description: Task type discriminator. Must be `"CODE_EVALUATION"`.
      additionalProperties: false
      description: |
        Request body for creating a `CODE_EVALUATION` task. Requires `evaluators`
        and exactly one of `project_id` or `dataset_id`. When `dataset_id` is provided,
        `experiment_ids` must contain at least one entry. Supports the same span and
        trace/session evaluator shapes as `CreateTemplateEvaluationTaskRequest`.
    CreateRunExperimentTaskRequest:
      type: object
      required:
        - name
        - type
        - dataset_id
        - run_configuration
      properties:
        name:
          type: string
          minLength: 1
          description: Task name
        type:
          type: string
          enum:
            - RUN_EXPERIMENT
          description: Task type discriminator. Must be `"RUN_EXPERIMENT"`.
        dataset_id:
          type: string
          description: Dataset identifier (base64). Required for `RUN_EXPERIMENT` tasks.
        run_configuration:
          $ref: '#/components/schemas/RunConfigurationRequest'
      additionalProperties: false
      description: |
        Request body for creating a `RUN_EXPERIMENT` task. Requires `dataset_id` and
        `run_configuration`. Does not support continuous execution — runs are triggered
        explicitly via `POST /v2/tasks/{task_id}/trigger`.
    UpdateEvaluationTaskRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New task name.
        sampling_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Sampling rate between 0 and 1. Only applicable for project-based tasks.
        is_continuous:
          type: boolean
          description: Whether the task runs continuously. Only applicable for project-based tasks.
        query_filter:
          type: string
          nullable: true
          description: |
            Task-level query filter (span shape). Pass `null` to clear. Mutually
            exclusive with `query_filters`.
        query_filters:
          allOf:
            - $ref: '#/components/schemas/TaskQueryFiltersInput'
          nullable: true
          description: |
            Named query filters plus optional expression (trace/session shape).
            Pass `null` to clear the entire multi-query shape (filters and
            expression together). Mutually exclusive with `query_filter`.
        evaluators:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaskEvaluatorInput'
          description: |
            Replaces the entire evaluator list. At least one evaluator is required
            when provided. Omit the field to leave evaluators unchanged.
      additionalProperties: false
      minProperties: 1
      description: |
        PATCH body for `TEMPLATE_EVALUATION` and `CODE_EVALUATION` tasks. The two
        types share the same updatable shape; the server derives the task type
        from the URL's task record. At least one field must be provided.

        Evaluators carry one of two mutually exclusive shapes depending on their data
        granularity. Span evaluators use task-level `query_filter` plus per-evaluator
        `column_mappings`/`query_filter`. Trace/session evaluators use task-level
        `query_filters` plus per-evaluator `query_mappings`. Mixing the two shapes
        returns 400.
    UpdateRunExperimentTaskRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New task name.
        run_configuration:
          $ref: '#/components/schemas/RunConfigurationRequest'
      additionalProperties: false
      minProperties: 1
      description: |
        PATCH body for `RUN_EXPERIMENT` tasks. The server derives the task type
        from the URL's task record. At least one of `name` or `run_configuration`
        must be provided. When `run_configuration` is provided the stored config
        is fully replaced (existing configs are marked inactive and the new config
        is inserted atomically in a transaction).
    ListTaskRunsResponse:
      type: object
      required:
        - task_runs
        - pagination
      properties:
        task_runs:
          type: array
          items:
            $ref: '#/components/schemas/TaskRun'
          description: A list of task runs
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'
          description: Pagination metadata for cursor-based navigation
      additionalProperties: false
      x-forward-compatible: true
    TriggerEvaluationTaskRunRequest:
      type: object
      properties:
        data_start_time:
          type: string
          format: date-time
          description: |
            ISO 8601 start of the data window to evaluate. For model-based tasks,
            defaults to the task's last run time. Required on the first run (when no
            previous run exists). Not applicable to dataset-based tasks.
        data_end_time:
          type: string
          format: date-time
          description: |
            ISO 8601 end of the data window to evaluate. For model-based tasks,
            defaults to now. Not applicable to dataset-based tasks.
        max_spans:
          type: integer
          minimum: 1
          description: Maximum number of spans to process (default 10000).
        override_evaluations:
          type: boolean
          description: |
            Whether to re-evaluate data that already has evaluation labels
            (default `false`).
        experiment_ids:
          type: array
          items:
            type: string
          description: |
            Experiment identifiers (base64) to run against. Only for dataset-based
            `TEMPLATE_EVALUATION` / `CODE_EVALUATION` tasks.
      additionalProperties: false
      description: |
        Trigger request for `TEMPLATE_EVALUATION` or `CODE_EVALUATION` tasks.
        `data_start_time` and `data_end_time` together must span no more than 30 days.
        `data_start_time` must be before `data_end_time`.
    TriggerRunExperimentTaskRunRequest:
      type: object
      required:
        - experiment_name
      properties:
        experiment_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^"\\]*$
          description: |
            Display name for the experiment to be created. Must be unique within
            the dataset, 1–255 characters, and must not contain double quotes (`"`)
            or backslashes (`\`).
        dataset_version_id:
          type: string
          description: |
            Dataset version identifier (base64). Defaults to the latest version
            when omitted.
        example_ids:
          type: array
          items:
            type: string
          description: |
            Specific example IDs to run against. Mutually exclusive with
            `max_examples`. When both are omitted, all examples are used.
        max_examples:
          type: integer
          minimum: 1
          description: |
            Maximum number of examples to run (dataset order). Mutually exclusive
            with `example_ids`. When both are omitted, all examples are used.
        query_filter:
          type: string
          description: |
            Optional filter expression. When provided, the experiment (and any
            chained evaluation tasks) runs only on the dataset examples matching
            the filter, instead of the whole dataset. May be combined with
            `example_ids` — the run set is then the intersection (the given
            examples that also match the filter) — or with `max_examples` to cap
            the filtered set.
        tracing_metadata:
          type: object
          additionalProperties:
            type: string
          description: |
            Arbitrary key-value metadata. Providing this enables tracing for
            the run.
        evaluation_task_ids:
          type: array
          items:
            type: string
          description: |
            Task identifiers (base64) of evaluation tasks to trigger after the
            experiment run completes. Supported for all `RUN_EXPERIMENT`
            experiment types.
      additionalProperties: false
      description: |
        Trigger request for `RUN_EXPERIMENT` tasks. `example_ids` and `max_examples`
        are mutually exclusive; at most one may be provided. `query_filter` may be
        combined with `example_ids` (the run set is their intersection) or with
        `max_examples`.
