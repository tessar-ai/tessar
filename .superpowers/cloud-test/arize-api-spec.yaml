      description: The unique API key identifier (base64)
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: QXBpS2V5OjEyMzQ1
    ApiKeyStatusQueryParam:
      name: status
      in: query
      required: false
      description: |
        Filter by API key status.
        - ACTIVE - Only return keys that are valid for use.
        - REVOKED - Only return keys that have been revoked.

        When not specified, defaults to `ACTIVE`.
      schema:
        $ref: '#/components/schemas/ApiKeyStatus'
      example: ACTIVE
    ApiKeyTypeQueryParam:
      name: key_type
      in: query
      required: false
      description: |
        Filter by API key type.
        - USER - Key associated with a specific user.
        - SERVICE - Key associated with a bot user for service authentication.
      schema:
        $ref: '#/components/schemas/ApiKeyType'
      example: USER
    OperationNameQueryParam:
      name: operation_name
      in: query
      required: false
      description: Filter results to exact, case-sensitive operation names. Repeat this parameter to select more than one name. Keep the same names when requesting the next page.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 255
      example:
        - createUserApiKey
        - revokeApiKey
    OperationTypeQueryParam:
      name: operation_type
      in: query
      required: false
      description: Filter results to a specific operation type.
      schema:
        $ref: '#/components/schemas/AuditLogOperationType'
      example: MUTATION
    DatasetIdPathParam:
