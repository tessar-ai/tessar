      properties:
        id:
          type: string
          pattern: ^[A-E]$
          description: |
            Single-letter query id, one of `A`-`E`. Unique within the task. Referenced
            by `query_filters.expression` and by each evaluator's `query_mappings`.
        filter:
          type: string
          description: The query filter expression for this named query.
      additionalProperties: false
      description: |
        A single named task-level query filter (trace/session shape). The `id` is a
        logical label used in `query_filters.expression` and per-evaluator
        `query_mappings`.
      x-forward-compatible: true
    TaskQueryFilterInput:
      type: object
      required:
        - id
        - filter
      properties:
        id:
          type: string
          pattern: ^[A-E]$
          description: |
            Single-letter query id, one of `A`-`E`. Unique within the task. Referenced
            by `query_filters.expression` and by each evaluator's `query_mappings`.
        filter:
          type: string
          maxLength: 2000
          description: The query filter expression for this named query.
      additionalProperties: false
      description: |
        A single named task-level query filter for create/update requests (trace/session
        shape). The `id` is a logical label used in `query_filters.expression` and
